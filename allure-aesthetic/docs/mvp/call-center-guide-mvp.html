/* ---------------- تجميع فئات ليزر إزالة الشعر (منطقة + باقات + مستلزمات) في قسم واحد ---------------- */
const LASER_GROUPS = [
  {title:"ليزر إزالة الشعر بالمنطقة - سيدات (Laser Hair Removal - Women)", main:"Laser - إزالة الشعر بالمنطقة", extras:["باقات نبضات مدفوعة مقدمًا - سيدات (Prepaid Pulses)","مستلزمات جلسة الليزر (Laser Supplies)"]},
  {title:"ليزر إزالة الشعر - رجالة (Laser Hair Removal - Men)", main:"إزالة الشعر للرجال (Laser - Men)", extras:["مستلزمات جلسة الليزر (Laser Supplies)"]},
];

function buildPriceRenderUnits(categories){
  const byName = {};
  categories.forEach(c=>{ byName[c.cat]=c; });
  const consumed = new Set();
  const units = [];
  categories.forEach(cat=>{
    if(consumed.has(cat.cat)) return;
    const group = LASER_GROUPS.find(g=>g.main===cat.cat);
    if(group){
      const subs = [{cat, isMain:true}];
      group.extras.forEach(name=>{
        if(byName[name] && !consumed.has(name)){ subs.push({cat:byName[name], isMain:false}); consumed.add(name); }
      });
      units.push({type:"group", title:group.title, subs});
    } else {
      units.push({type:"single", cat});
    }
  });
  return units;
}

function splitBilingualName(name){
  const m = name.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  if(!m) return {ar:name, en:""};
  return {ar:m[1].trim(), en:m[2].trim()};
}

function renderAreaPricingTable(cat, q){
  const rows = [];
  const items = cat.items;
  for(let i=0;i<items.length;i++){
    const [name, price] = items[i];
    const isPackageRow = /باكدج|Package/i.test(name) && i>0 && name.startsWith(items[i-1][0]);
    if(isPackageRow) continue; // already attached to the previous row
    const next = items[i+1];
    const isPairedPackage = next && /باكدج|Package/i.test(next[0]) && next[0].startsWith(name);
    rows.push({area:name, single:price, pack: isPairedPackage ? next[1] : null});
  }
  const filtered = q ? rows.filter(r=>r.area.toLowerCase().includes(q)) : rows;
  if(filtered.length===0) return "";
  return `
    <div class="area-price-wrap">
      <table class="data area-price-table">
        <thead><tr><th>المنطقة</th><th>جلسة واحدة</th><th>باكدج ٣ جلسات</th></tr></thead>
        <tbody>
          ${filtered.map(r=>{
            const {ar, en} = splitBilingualName(r.area);
            return `<tr>
              <td><span class="ar-name">${escapeHtml(ar)}</span>${en?` <span class="en-name">(${escapeHtml(en)})</span>`:""}</td>
              <td class="price-cell">${escapeHtml(r.single)} LE</td>
              <td class="price-cell">${r.pack? escapeHtml(r.pack)+" LE" : "—"}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderSimplePriceTable(cat, q){
  const filtered = q ? cat.items.filter(([name])=>name.toLowerCase().includes(q)) : cat.items;
  if(filtered.length===0) return "";
  return `
    <div class="subcat-block">
      <div class="subcat-title">${escapeHtml(cat.cat)}</div>
      <table class="data">
        <thead><tr><th>الخدمة</th><th>السعر</th></tr></thead>
        <tbody>
          ${filtered.map(([name,price])=>{
            const {ar, en} = splitBilingualName(name);
            const label = en ? `<span class="ar-name">${escapeHtml(ar)}</span> <span class="en-name">(${escapeHtml(en)})</span>` : escapeHtml(name);
            return `<tr><td>${label}</td><td class="price-cell">${escapeHtml(price)} LE</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderLaserGroup(unit, query){
  const q = query.trim().toLowerCase();

  if(editMode){
    const inner = unit.subs.map(s=>renderCategorySection(s.cat, query)).join("");
    return `<div class="laser-group-wrap"><div class="laser-group-label">🧊 ${escapeHtml(unit.title)}</div>${inner}</div>`;
  }

  const mainCat = unit.subs.find(s=>s.isMain).cat;
  const extras = unit.subs.filter(s=>!s.isMain).map(s=>s.cat);
  const allItems = [mainCat, ...extras].flatMap(c=>c.items);
  const anyMatch = !q || allItems.some(it=>it[0].toLowerCase().includes(q));
  if(!anyMatch){
    return `<div class="section" data-key="grp:${escapeHtml(unit.title)}" style="display:none;"></div>`;
  }
  const isOpen = openSections.has("grp:"+unit.title) || (q && anyMatch);

  return `
    <div class="section" data-key="grp:${escapeHtml(unit.title)}" data-open="${isOpen}">
      <button class="section-toggle" data-key="grp:${escapeHtml(unit.title)}"><h3 class="en">${escapeHtml(unit.title)}</h3><span class="count">${allItems.length} بند</span></button>
      <div class="section-body">
        ${renderAreaPricingTable(mainCat, q)}
        ${extras.map(c=>renderSimplePriceTable(c, q)).join("")}
      </div>
    </div>
  `;
}

function renderPriceUnits(categories, query){
  return buildPriceRenderUnits(categories).map(u=> u.type==="group" ? renderLaserGroup(u, query) : renderCategorySection(u.cat, query)).join("");
}

function renderCategorySection(cat, query){
  const q = query.trim().toLowerCase();
  const ce = editMode ? ` contenteditable="true"` : "";
  const indexed = cat.items.map((item,idx)=>({item, idx}));
  const filtered = q ? indexed.filter(({item})=>item[0].toLowerCase().includes(q)) : indexed;
  const isOpen = openSections.has("cat:"+cat.cat) || (q && filtered.length>0);
  const info = CATEGORY_INFO[cat.cat];
  const noteHtml = info && info.priceNote ? `<div class="price-note">${escapeHtml(info.priceNote)}</div>`
    : (info && info.defKey && DEFS[info.defKey] && DEFS[info.defKey].priceNote) ? `<div class="price-note">${escapeHtml(DEFS[info.defKey].priceNote)}</div>` : "";

  if(filtered.length===0 && q){
    return `<div class="section" data-key="cat:${escapeHtml(cat.cat)}" data-cat="${escapeHtml(cat.cat)}" style="display:none;"></div>`;
  }

  return `
    <div class="section" data-key="cat:${escapeHtml(cat.cat)}" data-cat="${escapeHtml(cat.cat)}" data-open="${isOpen}">
      <button class="section-toggle" data-key="cat:${escapeHtml(cat.cat)}"><h3 class="en">${escapeHtml(cat.cat)}</h3><span class="count">${filtered.length} خدمة</span></button>
      <div class="section-body">

          <thead><tr><th>الخدمة</th><th>السعر</th>${editMode?"<th></th>":""}</tr></thead>
          <tbody>
            ${filtered.map(({item, idx})=>`<tr class="${editMode?'':'price-row'}" data-cat="${escapeHtml(cat.cat)}" data-item="${escapeHtml(item[0])}" data-item-idx="${idx}">
              <td${ce} data-item-field="name">${escapeHtml(item[0])}</td>
              <td class="price-cell"><span${ce} data-item-field="price">${escapeHtml(item[1])}</span> LE</td>
              ${editMode?`<td><button type="button" class="del-btn" data-del-item="${idx}">🗑</button></td>`:""}
            </tr>`).join("")}
          </tbody>
        </table>
        ${editMode ? `<button type="button" class="add-row-btn" data-add-item-cat="${escapeHtml(cat.cat)}" style="margin-top:8px;">➕ خدمة جديدة</button>` : ""}
      </div>

function attachHandlers(branch){
  mainEl.querySelectorAll(".section-toggle").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const key = btn.dataset.key;
      const section = btn.closest(".section");
      if(!section) return;
      const isOpen = section.getAttribute("data-open") === "true";
      section.setAttribute("data-open", (!isOpen).toString());
      if(isOpen) openSections.delete(key); else openSections.add(key);
    });
  });

  mainEl.querySelectorAll(".price-row").forEach(row=>{
    row.addEventListener("click", ()=>{
      const catName = row.dataset.cat;
      const itemName = row.dataset.item;
      const info = CATEGORY_INFO[catName];
      if(!info){ openInfoPanel(itemName, null, null); return; }
      const def = info.defKey ? DEFS[info.defKey] : null;
      let note = info.priceNote || null;
      if(info.brandNotes){
        const brandNote = findBrandNote(itemName, info.brandNotes);
        if(brandNote) note = brandNote;
      }
      openInfoPanel(itemName, def, note);
    });
  });

  mainEl.querySelectorAll("[data-chip]").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const name = chip.dataset.chip;
      const svcId = CHIP_TO_SERVICE22[name];
      if(svcId && SERVICES22_BY_ID[svcId]){ openInfoPanelSvc22(SERVICES22_BY_ID[svcId]); return; }
      const defKey = SERVICE_CHIP_DEFS[name];
      if(!defKey){ openInfoPanel(name, null, null); return; }
      openInfoPanel(name, DEFS[defKey], null);
    });
  });

  document.getElementById("priceSearch").addEventListener("input", (e)=>{
    const q = e.target.value;
    const container = document.getElementById("priceAccordions");
    container.innerHTML = renderPriceUnits(branch.priceCategories, q);
    attachHandlers(branch);
  });

  const weekPrevBtn = document.getElementById("weekPrev");
  if(weekPrevBtn) weekPrevBtn.addEventListener("click", ()=>{ weekOffset -= 1; renderBranches(); });
  const weekNextBtn = document.getElementById("weekNext");
  if(weekNextBtn) weekNextBtn.addEventListener("click", ()=>{ weekOffset += 1; renderBranches(); });
  const weekResetBtn = document.getElementById("weekReset");
  if(weekResetBtn) weekResetBtn.addEventListener("click", ()=>{ weekOffset = 0; renderBranches(); });
  const weekClearBtn = document.getElementById("weekClearOverrides");
  if(weekClearBtn) weekClearBtn.addEventListener("click", ()=>{
    const wk = weekKeyStr(getWeekStart(weekOffset));
    if(branch.weekOverrides && branch.weekOverrides[wk] && confirm("متأكد إنك عايز ترجع جدول الأسبوع ده للجدول العادي؟")){
      delete branch.weekOverrides[wk];
      editStatus.textContent = "في تعديلات لسه ما اتحفظتش.";
      renderBranches();
    }
  });

  if(editMode) wireEditHandlers(branch);
}

function wireEditHandlers(branch){
  const markEdited = ()=>{ editStatus.textContent = "في تعديلات لسه ما اتحفظتش."; };

  // --- Branch head fields ---
  const addrEl = mainEl.querySelector('[data-field="address"]');
  if(addrEl) addrEl.addEventListener("blur", ()=>{ branch.address = addrEl.textContent.trim(); markEdited(); });
  const paymentEl = mainEl.querySelector('[data-field="payment"]');
  if(paymentEl) paymentEl.addEventListener("blur", ()=>{ branch.payment = paymentEl.textContent.split("/").map(s=>s.trim()).filter(Boolean); markEdited(); });
  const managersEl = mainEl.querySelector('[data-field="managers"]');
  if(managersEl) managersEl.addEventListener("blur", ()=>{ branch.managers = managersEl.textContent.split(/[،,]/).map(s=>s.trim()).filter(Boolean); markEdited(); });

  mainEl.querySelectorAll("[data-consult-idx]").forEach(el=>{
    el.addEventListener("blur", ()=>{
      const i = parseInt(el.dataset.consultIdx, 10);
      if(branch.consultations[i]){ branch.consultations[i].price = el.textContent.trim(); markEdited(); }
    });
  });

  // --- Doctors ---
  mainEl.querySelectorAll('[data-doctor-field="name"]').forEach(el=>{
    el.addEventListener("blur", ()=>{
      const di = parseInt(el.closest("tr").dataset.doctorIdx, 10);
      if(branch.doctors[di]){ branch.doctors[di].name = el.textContent.trim(); markEdited(); }
    });
  });
  mainEl.querySelectorAll('[data-doctor-day]').forEach(el=>{
    el.addEventListener("blur", ()=>{
      const di = parseInt(el.closest("tr").dataset.doctorIdx, 10);
      const day = el.dataset.doctorDay;
      const wk = el.dataset.weekKey;
      if(!branch.doctors[di]) return;
      const val = (el.innerText||"").split("\n").map(s=>s.trim()).filter(Boolean).join("\n");
      if(weekOffset === 0){
        if(!branch.doctors[di].week) branch.doctors[di].week = {};
        if(val === "") delete branch.doctors[di].week[day];
        else branch.doctors[di].week[day] = val;
      } else {
        const templateVal = ((branch.doctors[di].week||{})[day] || "");
        if(!branch.weekOverrides[wk]) branch.weekOverrides[wk] = {};
        if(!branch.weekOverrides[wk][di]) branch.weekOverrides[wk][di] = {};
        if(val === templateVal){
          delete branch.weekOverrides[wk][di][day];
        } else {
          branch.weekOverrides[wk][di][day] = val;
        }
      }
      markEdited();
      renderBranches();
    });
  });
  mainEl.querySelectorAll('[data-del-doctor]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const di = parseInt(btn.dataset.delDoctor, 10);
      if(confirm("متأكد إنك عايز تمسح الدكتورة دي؟")){
        branch.doctors.splice(di, 1);
        markEdited();
        renderBranches();
      }
    });
  });
  const addDoctorBtn = document.getElementById("addDoctorBtn");
  if(addDoctorBtn) addDoctorBtn.addEventListener("click", ()=>{
    branch.doctors.push({name:"دكتورة جديدة", week:{}});
    markEdited();
    renderBranches();
  });
  mainEl.querySelectorAll('[data-doctor-field="notes"]').forEach(el=>{
    el.addEventListener("blur", ()=>{
      const li = el.closest("[data-doctor-note-idx]");
      const di = parseInt(li.dataset.doctorNoteIdx, 10);
      if(!branch.doctors[di]) return;
      branch.doctors[di].notes = el.textContent.trim();
      delete branch.doctors[di].consultOverride;
      delete branch.doctors[di].tempNote;
      markEdited();
    });
  });

  // --- Booking rules ---
  mainEl.querySelectorAll('[data-rule-text]').forEach(el=>{
    el.addEventListener("blur", ()=>{
      const i = parseInt(el.dataset.ruleText, 10);
      branch.bookingRules[i] = el.innerHTML.trim();
      markEdited();
    });
  });
  mainEl.querySelectorAll('[data-del-rule]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const i = parseInt(btn.dataset.delRule, 10);
      branch.bookingRules.splice(i, 1);
      markEdited();
      renderBranches();
    });
  });
  const addRuleBtn = document.getElementById("addRuleBtn");
  if(addRuleBtn) addRuleBtn.addEventListener("click", ()=>{
    branch.bookingRules.push("قاعدة جديدة — دوس تعدلها");
    markEdited();
    renderBranches();
  });

  // --- Price items ---
  mainEl.querySelectorAll('[data-item-field="name"]').forEach(el=>{
    el.addEventListener("blur", ()=>{
      const tr = el.closest("tr");
      const catName = tr.dataset.cat;
      const idx = parseInt(tr.dataset.itemIdx, 10);
      const cat = branch.priceCategories.find(c=>c.cat===catName);
      if(cat && cat.items[idx]){ cat.items[idx][0] = el.textContent.trim(); markEdited(); }
    });
  });
  mainEl.querySelectorAll('[data-item-field="price"]').forEach(el=>{
    el.addEventListener("blur", ()=>{
      const tr = el.closest("tr");
      const catName = tr.dataset.cat;
      const idx = parseInt(tr.dataset.itemIdx, 10);
      const cat = branch.priceCategories.find(c=>c.cat===catName);
      if(cat && cat.items[idx]){ cat.items[idx][1] = el.textContent.trim(); markEdited(); }
    });
  });
  mainEl.querySelectorAll('[data-del-item]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const tr = btn.closest("tr");
      const catName = tr.dataset.cat;
      const idx = parseInt(btn.dataset.delItem, 10);
      const cat = branch.priceCategories.find(c=>c.cat===catName);
      if(cat && confirm("متأكد إنك عايز تمسح الخدمة دي؟")){
        cat.items.splice(idx, 1);
        markEdited();
        renderBranches();
      }
    });
  });
  mainEl.querySelectorAll('[data-add-item-cat]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const cat = branch.priceCategories.find(c=>c.cat===btn.dataset.addItemCat);
      if(cat){
        cat.items.push(["خدمة جديدة","0"]);
        markEdited();
        renderBranches();
      }
    });
  });
}

function svc22CardHtml(sv, openId){
  const open = sv.id===openId;

  }</tbody></table></div>` : "";
  const booking = sv.booking.length ? `<h5>قواعد الحجز (زي مكتب الأسعار)</h5>${ulHtml(sv.booking)}` : "";
  const care = sv.care.length ? `<h5>قبل وبعد الجلسة (للريسبشن)</h5>${ulHtml(sv.care.map(c=>`${c[0]}: ${c[1]}`))}` : "";
  const say = sv.say.length ? `<h5>قول للعميل</h5>${sv.say.map(([q,a])=>`<div class="svc22-qa"><div class="q">«${escapeHtml(q)}»</div><div class="a">← ${escapeHtml(a)}</div></div>`).join("")}` : "";

  return `<div class="svc22-card" data-open="${open}" data-svc="${sv.id}">
    <div class="svc22-head" data-toggle="${sv.id}"><span><b>${escapeHtml(sv.name)}</b>${branchTag}</span><span class="svc22-arrow">▾</span></div>

      ${review}
    </div>
  </div>`;
}

/* ---------------- قيود الدكاترة (Rules) ----------------
   status: "Open" = الدكتورة اللي بتتحجز Open — الباقي كله Confirmed
   noMen: سيدات بس | noLaserMen: ممنوع ليزر رجالة | menLaserAreas: مناطق الرجالة المسموحة
   noSmallAreas: مش بتستقبل أريات صغيرة | laserCutoff: {يوم: آخر ليزر}                      */
const RULES = {
  "tanta1:hebaghonim":       {status:"Open", noMen:true, noSmallAreas:true},
  "tanta1:passantawara":     {status:"Open", noMen:true, noSmallAreas:true},
  "newcairo:passantawara":   {status:"Open"},
  "kafrelsheikh:kholoudfayrouz": {noLaserMen:true},
  "kafrelsheikh:nourhanelabd":   {noLaserMen:true},
  "kafrelsheikh:shimaahassan":   {noLaserMen:true},
  "shebin:olagadallah":  {menLaserAreas:["m_beard","m_underarm"], laserCutoff:{"الأربعاء":"17:00"}, noOverlapEver:true},
  "shebin:marinasalah":  {menLaserAreas:["m_beard","m_underarm"]},
  "shebin:zainabeldaly": {menLaserAreas:["m_beard"], note:"أي ليزر معاها الصبح فقط: بيانات الحالة تتبعت على الجروب وهيتم التواصل معاها."},
  "shebin:mahitabsabry": {laserCutoff:{"السبت":"18:00"}},
};
const BRANCH_RULES = {
  tanta2: {laserCutoff:{days:["الاثنين","الثلاثاء","الخميس"], before:"16:00", at:"14:00"}},
};
const ruleOf = (bk,d) => RULES[bk+":"+slug(d.name)] || {};

/* ---------------- تحديثات الفروع (Updates) ---------------- */
let UPDATES = [];
let dbRef = null, dbState = "pending", saveChain = Promise.resolve();
const UP_TYPES = {off:"غايبة", stop:"وقف حجز", hours:"ساعات مختلفة", confirm:"الدور فاضي — احجزي Confirmed"};

function upsFor(bk, docName, date){
  const s = slug(docName);
  return UPDATES.filter(u => u.branch===bk && slug(u.doctor)===s && u.from<=date && (u.to||u.from)>=date);
}
function pruneUpdates(){
  const lim = addDays(cairoToday(),-2);
  UPDATES = UPDATES.filter(u => (u.to||u.from) >= lim);
}
async function initDb(){
  try{
    if(!window.claude || !window.claude.use){ dbState="none"; return; }
    const db = await window.claude.use("db");
    if(!db){ dbState="none"; draw(); return; }
    dbRef = db.doc("guide/updates");
    dbState = "ok";
    dbRef.onSnapshot(snap=>{
      if(snap.exists){ const it=(snap.data()||{}).items; UPDATES = Array.isArray(it) ? it.slice() : []; }
      draw();
    }, err=>{ console.warn("updates sync", err); dbState="none"; draw(); });
  }catch(e){ dbState="none"; }
}
function saveUpdates(){
  pruneUpdates();
  if(!dbRef) return;
  const items = UPDATES.slice();
  saveChain = saveChain.then(()=>dbRef.set({items:items, rev:Date.now()})).catch(e=>{ console.warn("save updates failed", e); });
}

/* ---------------- الحالة (State) ---------------- */
const S = {tab:"book", branch:null, service:null, areas:[], gender:null, doctor:null, date:null, from:null, to:null, name:"", phone:""};
function resetFrom(step){
  const order=["service","gender","areas","doctor","date","time"];
  const i=order.indexOf(step);
  if(i<=0){ S.service=null; }
  if(i<=1){ S.gender=null; }
  if(i<=2){ S.areas=[]; }
  if(i<=3){ S.doctor=null; }
  if(i<=4){ S.date=null; }
  if(i<=5){ S.from=null; S.to=null; }
}
function ensureBranch(){
  if(!S.branch || !DATA[S.branch]) S.branch = DATA[currentBranch] ? currentBranch : Object.keys(DATA)[0];
  const b = DATA[S.branch]; if(b && !b.weekOverrides) b.weekOverrides = {};
  return b;
}

/* ---------------- المحرك ---------------- */
function branchHas(bk, svc){
  if(svc.id==="consult") return true;
  return ((DATA[bk]&&DATA[bk].services)||[]).some(x=>svc.match.test(x));
}
function compatSeg(seg){ return S.service==="laser" ? (seg.kind==="all"||seg.kind==="laser") : seg.kind!=="laser"; }

function evalDoctor(bk, di){
  const d = DATA[bk].doctors[di], rule = ruleOf(bk,d);
  const laser = S.service==="laser", male = S.gender==="male";
  const reasons = [], notes = [];
  if(male && rule.noMen) reasons.push("بتستقبل سيدات بس");
  if(male && laser && rule.noLaserMen) reasons.push("ممنوع ليزر رجالة معاها");
  if(male && laser && rule.menLaserAreas){
    const bad = S.areas.filter(a=>!rule.menLaserAreas.includes(a));
    if(bad.length) reasons.push("مع الرجالة بتعمل "+rule.menLaserAreas.map(a=>areaAr("laser",a)).join(" و")+" بس");
  }
  if(laser && rule.noSmallAreas && S.areas.length && S.areas.every(a=>(LASER_AREAS.find(x=>x.id===a)||{}).small))
    reasons.push("مش بتستقبل الأريات الصغيرة (موستاش / دقن / أندر أرم بس) — بتتحول على باقي الدكاترة");
  const week = d.week||{};
  let anyDay=false, anyCompat=false;
  DAYS.forEach(day=>parseDay(week[day]).forEach(s=>{ anyDay=true; if(compatSeg(s)) anyCompat=true; }));
  if(!anyDay) reasons.push("مفيش مواعيد ثابتة مسجلة ليها");
  else if(!anyCompat) reasons.push(laser ? "مفيش فترات ليزر في جدولها" : "جدولها ليزر بس");
  if(male && laser && (S.areas.includes("m_fbnobox")||S.areas.includes("m_fbbox"))) notes.push("Full Body للرجال: مع Doctor Male فقط — اتأكد قبل التأكيد");
  if(rule.note) notes.push(rule.note);
  if(d.notes) notes.push(d.notes);
  if(d.tempNote) notes.push(d.tempNote);
  if(S.service==="consult" && d.consultOverride) notes.push(d.consultOverride);
  return {di, name:d.name, ok:!reasons.length, reasons, notes, status:rule.status||"Confirmed"};
}

function windowsFor(bk, di, date){
  const br = DATA[bk], d = br.doctors[di], rule = ruleOf(bk,d), dow = dayName(date);
  const ups = upsFor(bk,d.name,date);
  const res = {dow, ups, blocked:null, raw:"", segs:[], windows:[], hoursUpdate:null};
  const blk = ups.find(u=>u.type==="off"||u.type==="stop");
  if(blk){ res.blocked = blk; return res; }
  const hu = ups.find(u=>u.type==="hours" && u.tf!=null && u.tt!=null);
  if(hu){ res.hoursUpdate = hu; res.segs=[{from:+hu.tf,to:+hu.tt,kind:"all"}]; }
  else { res.raw = getEffectiveDayValue(br, di, dow, satOf(date)); res.segs = parseDay(res.raw); }
  const laser = S.service==="laser", out = [];
  res.segs.forEach(s0=>{
    if(!compatSeg(s0)) return;
    const s = {from:s0.from, to:s0.to, cut:null, derma:s0.kind==="derma"};
    if(laser){
      const c1 = rule.laserCutoff && rule.laserCutoff[dow];
      if(c1){ const c=hm(c1); if(c<s.to){ s.to=c; s.cut=c; } }
      const brr = BRANCH_RULES[bk];
      if(brr && brr.laserCutoff.days.includes(dow) && s.from<hm(brr.laserCutoff.before)){
        const c=hm(brr.laserCutoff.at); if(c<s.to){ s.to=c; s.cut=c; }
      }
    }
    if(s.to>s.from) out.push(s);
  });
  out.sort((a,b)=>a.from-b.from);
  const merged=[];
  out.forEach(s=>{ const l=merged[merged.length-1]; if(l && s.from<=l.to){ l.to=Math.max(l.to,s.to); l.cut=l.cut||s.cut; l.derma=l.derma||s.derma; } else merged.push(Object.assign({},s)); });
  res.windows = merged;
  return res;
}

function verdictFor(bk, di, date){
  const d = DATA[bk].doctors[di], w = windowsFor(bk,di,date);
  const v = {level:"no", reasons:[], warnings:[], overlap:[], w};
  const dn = w.dow;
  if(w.blocked){
    v.reasons.push(w.blocked.type==="off" ? "غايبة يوم "+dn+" — Update من الفرع" : "حجزها متوقف يوم "+dn+" — Update من الفرع");
    if(w.blocked.note) v.reasons.push("الملاحظة: "+w.blocked.note);
    return v;
  }
  if(w.hoursUpdate) v.warnings.push("Update من الفرع: ساعاتها يوم "+dn+" مختلفة ("+rangeLabel(+w.hoursUpdate.tf,+w.hoursUpdate.tt)+")"+(w.hoursUpdate.note?" — "+w.hoursUpdate.note:""));
  if(!w.segs.length){
    v.reasons.push(/إجازة/.test(w.raw) ? "إجازة يوم "+dn : "مش شغالة يوم "+dn);
    return v;
  }
  if(!w.windows.length){
    v.reasons.push(S.service==="laser" ? "الفترات اللي شغالة فيها يوم "+dn+" مفيهاش ليزر (أو بعد آخر ميعاد ليزر)" : "الفترات اللي شغالة فيها يوم "+dn+" ليزر بس");
    return v;
  }
  w.windows.forEach(x=>{ const a=Math.max(x.from,S.from), b=Math.min(x.to,S.to); if(b>a) v.overlap.push({from:a,to:b}); });
  const avail = w.windows.map(x=>rangeLabel(x.from,x.to)).join(" ، ");
  if(!v.overlap.length){
    v.reasons.push("الوقت المطلوب برّه شيفتها. المتاح يوم "+dn+": "+avail);
    return v;
  }
  const full = v.overlap.length===1 && v.overlap[0].from===S.from && v.overlap[0].to===S.to;
  v.level = full ? "ok" : "warn";
  if(!full) v.warnings.push("المتاح فعليًا من الوقت المطلوب: "+v.overlap.map(o=>rangeLabel(o.from,o.to)).join(" ، ")+" (شيفتها يوم "+dn+": "+avail+")");
  w.windows.forEach(x=>{
    if(x.cut) v.warnings.push("آخر ميعاد ليزر معاها يوم "+dn+" الساعة "+tLabel(x.cut)+" — ممنوع ليزر بعده");
    if(x.derma) v.warnings.push("جزء من شيفتها جلدية بس — اتأكد إن الخدمة تنفع");
  });
  return v;
}

function nextDates(bk, di, from, count, horizon){
  const out=[]; let dt=from;
  for(let i=0;i<horizon && out.length<count;i++,dt=addDays(from,i)){
    const w=windowsFor(bk,di,dt);
    if(!w.blocked && w.windows.length) out.push({date:dt, w});
  }
  return out;
}

const DATA_TXT = "بالبيانات كاملة (اسم ورقم العميل، الخدمة والمناطق، الدكتورة، التاريخ والوقت)";
function decide(bk, di, date){
  const d = DATA[bk].doctors[di], rule = ruleOf(bk,d), dow = dayName(date);
  const diff = dayDiff(date, cairoToday());
  const when = diff<=0 ? "today" : diff===1 ? "tomorrow" : "later";
  let status = rule.status || "Confirmed", statusNote = "", placeholder = false;
  const steps=[], info=[], warns=[];
  /* Update من نوع "الدور فاضي": الفرع بلّغ إننا نحجز Confirmed بدل Open ليوم بعينه */
  const confirmUp = upsFor(bk, d.name, date).find(u=>u.type==="confirm");
  if(confirmUp && status==="Open"){
    status = "Confirmed";
    statusNote = confirmUp.note || "الفرع بلّغ إن الدور فاضي";
    info.push("الحجز اتحول لـ Confirmed مباشرة لأن الفرع بلّغ إن الدور فاضي.");
  }
  if(bk==="tanta1"){
    if(status==="Open" && dow==="السبت"){
      status="Confirmed"; statusNote="السبت بنأكده إحنا";
      steps.push("احجز في السيستم بحالة Confirmed (السبت بنأكده لأن الفرع إجازة الجمعة)");
      steps.push("ابعت للفرع Notice "+DATA_TXT+" علشان هم كمان يأكدوا");
      info.push("الفرع بيبعت يوم الخميس بالليل المواعيد المتاحة يوم السبت.");
    } else if(status==="Open"){
      steps.push("احجز في السيستم بحالة Open");
      steps.push("ابعت الحجز للفرع "+DATA_TXT+" — اتأكد إمتى وهتعمل أريا إيه");
      steps.push("استنى الفرع يأكد المعاد");
      info.push("لو الدكتورة هي اللي طلبت إننا نأكد المعاد، بنأكد إحنا.");
    } else {
      steps.push("احجز في السيستم بحالة Confirmed");
      steps.push("ابعت للفرع Notice فقط "+DATA_TXT+" — من غير ما تستنى تأكيد منهم");
    }
    info.push("لما الحجز بيتقفل بيتبعت Update بالحالة دي.");
    if(S.service!=="laser" && S.service!=="consult") info.push("أي سيرفيس غير الليزر أو الكشوفات بيتبعت للفرع حتى لو الحجز مقفول، وإحنا بنكلم العميلة.");
  } else if(bk==="tanta2"){
    if(when==="today"){
      statusNote="بعد موافقة الفرع على الجروب";
      steps.push("ابعت بيانات الحالة على الجروب "+DATA_TXT);
      steps.push("استنى رد الفرع: لو متاح كلّم العميلة واحجز Confirmed، ولو مش متاح أجّل معادها ليوم تاني");
    } else {
      steps.push("احجز في السيستم بحالة Confirmed من غير ما تستنى الفرع");
      steps.push("ابعت بيانات الحجز للفرع على الواتساب "+DATA_TXT);
    }
    info.push("لو العميلة عايزة الدكتورة دي واليوم كومبليت: ابعتها على الجروب أو اعرض يوم تاني الدكتورة موجودة فيه — ما ترشحش دكتورة تانية إلا لو العميلة اختارتها.");
  } else if(bk==="newcairo"){
    warns.push("مواعيد الدكاترة والأسعار في القاهرة الجديدة مختلفة عن باقي الفروع وبتتحدث دوريًا — اتأكد منها كل مرة.");
    if(status==="Open"){
      steps.push("ابعت الحجز بحالة Open "+DATA_TXT);
      steps.push("الـ Confirm بنعمله إحنا من عندنا (الكول سنتر)");
    } else {
      steps.push("احجز في السيستم بحالة Confirmed");
      steps.push("ابعت الحالة على الجروب "+DATA_TXT+" وإيه استفسارها");
    }
    info.push("كل الدكاترة بيشتغلوا للرجالة عادي.");
  } else if(bk==="shebin"){
    steps.push("احجز في السيستم بحالة Confirmed");
    steps.push("ابعت بيانات الحالة للفرع "+DATA_TXT);
    warns.push("ما تعملش أوفر لاب في الحجز — لو لازم يبقى من خلال الفرع: ابعت Open ببيانات الحالة وهيتم التواصل من الفرع.");
    if(rule.noOverlapEver) warns.push("الدكتورة دي بالذات ما بنعملش معاها أوفر لاب حتى لو السيستم مليان (بتاخد وقتها في السيشن).");
    if(when==="today" && ["zainabeldaly","ayaelgarwany","mahitabsabry","marinasalah"].includes(slug(d.name)))
      info.push("الحجز في نفس اليوم مفيش فيه مشكلة، إلا لو الفرع بلّغ إن الدكتورة هتمشي بدري.");
    info.push("مواعيد الدكاترة ثابتة، وأي Update (دكتورة بتغطي أو إجازة من اليوم) بيتبلّغ بيه.");
  } else {
    placeholder = true;
    steps.push("احجز في السيستم بحالة Confirmed");
    steps.push("ابعت بيانات الحجز للفرع "+DATA_TXT);
    info.push("قواعد الإرسال الخاصة بالفرع ده لسه ما اتحددتش — ده الشكل العام لحد ما نعتمدها.");
  }
  return {status, statusNote, steps, info, warns, placeholder, when};
}

/* ---------------- الأسعار والتعليمات ---------------- */
const PRICE_CAT = {
  fractional:/^Fractional/, botox:/^Botox/, filler:/^Fillers$/, skinbooster:/^Skin Boosters/,
  meso:/^Meso & Stem Cells/, peel:/^Peelings/, plasma:/^PRP/, exosomes:/Exosomes/, dermapen:/^Derma Pen/,
  hifu:/^HIFU/, cleansing:/^Facials/, oxygeneo:/^Facials/,
};
const num = x => parseFloat(String(x).replace(/[^\d.]/g,""));
const money = n => Number(n).toLocaleString("en")+" ج";
function priceHtml(bk, docIdx){
  const br = DATA[bk], cats = br.priceCategories || [];
  let rows = [];
  if(S.service==="consult"){
    const d = docIdx!=null ? br.doctors[docIdx] : null;
    (br.consultations||[]).filter(c=>!/^pulse$/i.test(c.name)).forEach(c=>rows.push([c.name, money(num(c.price))]));
    let h = rows.map(r=>`<div class="wf-row"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("");
    if(d && d.consultOverride) h += `<div class="wf-mini">⚠️ ${esc(d.consultOverride)}</div>`;
    return h;
  }
  if(S.service==="laser"){
    const male = S.gender==="male";
    const cat = cats.find(c=> male ? /Laser - Men/.test(c.cat) : /^Laser - إزالة/.test(c.cat));
    const sel = new Set(S.areas), lines = []; let total=0, priced=0; const unpriced=[];
    const take = (ids,label,key)=>{ if(ids.every(i=>sel.has(i))){ ids.forEach(i=>sel.delete(i)); lines.push({label,key}); } };
    if(male) take(["m_chest","m_back"],"Full Chest + Full Back","الصدر والضهر كامل (Full Chest & Back)");
    else {
      if(sel.has("w_underarm") && sel.has("w_bikini")){ ["w_underarm","w_bikini","w_bikiniline"].forEach(i=>sel.delete(i)); lines.push({label:"Under Arms + Bikini", key:"البكيني والأندر أرم (Bikini & Underarms)"}); }
      take(["w_face","w_neck"],"Face + Neck","الوجه والرقبة (Face & Neck)");
    }
    sel.forEach(id=>{
      if(id==="w_bikiniline") return;
      const a = LASER_AREAS.find(x=>x.id===id); if(!a) return;
      const key = a.p ? (typeof a.p==="string" ? a.p : (bk==="newcairo" ? a.p.n : a.p.s)) : null;
      lines.push({label:a.ar, key});
    });
    const rows=[];
    lines.forEach(l=>{
      const it = cat && l.key ? cat.items.find(i=>i[0]===l.key) : null;
      if(it){ total+=num(it[1]); priced++; rows.push([l.label, money(num(it[1]))]); } else unpriced.push(l.label);
    });
    let h = rows.map(r=>`<div class="wf-row"><span>${esc(r[0])}</span><b>يبدأ من ${esc(r[1])}</b></div>`).join("");
    if(priced>1) h += `<div class="wf-row wf-total"><span>الإجمالي (تقريبي)</span><b>${esc(money(total))}</b></div>`;
    if(unpriced.length) h += `<div class="wf-mini">سعر ${esc(unpriced.join("، "))} مش متسجل في الدليل — اسأل الفرع.</div>`;
    return h;
  }
  const re = PRICE_CAT[S.service];
  if(!re) return `<div class="wf-mini">السعر مش متسجل في الدليل للخدمة دي — اسأل الفرع.</div>`;
  let best=null;
  cats.filter(c=>re.test(c.cat)).forEach(c=>c.items.forEach(it=>{
    if(S.service==="oxygeneo" && !/oxygeneo/i.test(it[0])) return;
    const p=num(it[1]); if(p>=50 && (!best || p<best.p)) best={p, n:it[0]};
  }));
  return best ? `<div class="wf-row"><span>${esc(best.n)}</span><b>يبدأ من ${esc(money(best.p))}</b></div>` : `<div class="wf-mini">السعر مش متسجل في الدليل للخدمة دي — اسأل الفرع.</div>`;
}
function guidanceHtml(){
  const svc = svcById(S.service), def = svc.def && DEFS[svc.def];
  let h = `<div class="wf-say">🗨️ «السعر ده بيبدأ من كذا، والتقييم الطبي مع الدكتورة هو اللي بيحدد السعر النهائي وعدد الجلسات.»</div>`;
  if(S.service==="consult") h = `<div class="wf-say">🗨️ «الاستشارة مع الدكتورة هي اللي بتحدد الإجراء المناسب لحضرتك والسعر النهائي.»</div>`;
  if(S.service==="consult") return h;
  if(!def) return h + `<div class="wf-mini">مفيش تعليمات تفصيلية متسجلة للخدمة دي لسه.</div>`;
  const list = a => `<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(def.explain) h += `<div class="wf-say">🗨️ ${esc(def.explain)}</div>`;
  if(def.before) h += `<details><summary>قبل الجلسة</summary>${list(def.before)}</details>`;
  if(def.after) h += `<details><summary>بعد الجلسة</summary>${list(def.after)}</details>`;
  if(def.contra) h += `<details><summary>الموانع (بلّغ الدكتورة بيها)</summary>${list(def.contra)}</details>`;
  if(def.neverSay) h += `<details class="wf-never"><summary>⚠️ ممنوع تقوله للعميلة</summary>${list(def.neverSay)}</details>`;
  return h;
}

/* ---------------- رسالة الحجز ---------------- */
function buildMessage(bk, di, date, v, dec){
  const d = DATA[bk].doctors[di], svc = svcById(S.service);
  const areas = S.areas.length ? S.areas.map(a=>areaAr(S.service,a)).join("، ") : "";
  const isMale = S.gender==="male";
  const clientLabel = isMale ? "العميل" : "العميلة";
  const wantVerb = isMale ? "عايز" : "عايزة";
  /* رسالة الفرع: بيانات الحجز بس (بدون الحالة Open/Confirmed — دي لاستخدامنا الداخلي في الكول سنتر) */
  return [
    "*"+DATA[bk].name+"*",
    clientLabel+": "+(S.name||"—"),
    "الرقم: "+(S.phone||"—"),
    "الخدمة: "+svc.ar+(areas?" — "+areas:""),
    "الدكتورة: "+d.name,
    wantVerb+" ميعاد: "+dayName(date)+" "+fmtDate(date)+" — "+tLabel(S.from),
  ].filter(Boolean).join("\n");
}

/* ---------------- الرسم ---------------- */
let lastSteps = 0;
function chip(act, attrs, label, on, dis){
  return `<button type="button" class="wf-chip${on?" on":""}${dis?" dis":""}" data-act="${act}" ${attrs}${dis?" disabled":""}>${label}</button>`;
}
const timeOpts = (sel, step, dur) => {
  step = step||30; dur = dur||0;
  let h = `<option value="">— اختر —</option>`;
  for(let m=9*60; m<=23*60-dur; m+=step) h += `<option value="${m}"${sel===m?" selected":""}>${tLabel(m)}</option>`;
  return h;
};
function docDays(d){
  const parts=[]; DAYS.forEach(day=>{ const v=(d.week||{})[day]; if(v && !/إجازة/.test(v)) parts.push(day+" "+String(v).replace(/\n/g," / ")); });
  return parts.length ? parts.join(" · ") : "";
}
function updatesBanner(bk){
  const t=cairoToday(), t1=addDays(t,1);
  const rows = UPDATES.filter(u=>u.branch===bk && (u.from<=t1 && (u.to||u.from)>=t)).map(u=>{
    const when = (u.from<=t && (u.to||u.from)>=t) ? "النهاردة" : "بكرة";
    return `<div class="wf-banner-row">• <b>${esc(u.doctor)}</b> — ${esc(UP_TYPES[u.type]||u.type)} ${when}${u.type==="hours"&&u.tf!=null?" ("+rangeLabel(+u.tf,+u.tt)+")":""}${u.note?" — "+esc(u.note):""}</div>`;
  });
  return rows.length ? `<div class="wf-banner">📢 Updates من الفرع:${rows.join("")}</div>` : "";
}

function bookHtml(){
  const bk = S.branch, br = DATA[bk], today = cairoToday();
  let h = updatesBanner(bk), steps = 0;
  const num_ = n => `<span class="wf-n">${n}</span>`;
  /* 1 — الخدمة */
  steps++;
  h += `<div class="wf-step"><h4>${num_(1)} نوع الخدمة</h4><div class="wf-chips">` +
    SERVICES.map(s=>{
      const has = branchHas(bk,s);
      return chip("svc", `data-id="${s.id}"`, esc(s.ar), S.service===s.id, !has);
    }).join("") + `</div>` +
    (()=>{ const miss = SERVICES.filter(s=>!branchHas(bk,s)); if(!miss.length) return "";
      return `<div class="wf-mini">غير متاحة في ${esc(br.name)}: ` + miss.map(s=>{
        const where = Object.keys(DATA).filter(k=>k!==bk && branchHas(k,s)).map(k=>DATA[k].name);
        return esc(s.ar)+(where.length?" (متاحة في: "+esc(where.join("، "))+")":"");
      }).join(" — ") + `</div>`; })() + `</div>`;
  if(!S.service){ lastSteps=steps; return h; }
  const svc = svcById(S.service), laser = S.service==="laser";
  /* 2 — الجنس (قبل المناطق لأن المناطق بتختلف بين الستات والرجالة) */
  steps++;
  h += `<div class="wf-step"><h4>${num_(2)} جنس العميل</h4><div class="wf-chips">` +
    chip("gender",`data-id="female"`,"أنثى",S.gender==="female") + chip("gender",`data-id="male"`,"ذكر",S.gender==="male") + `</div></div>`;
  if(!S.gender){ lastSteps=steps; return h; }
  /* 3 — المناطق */
  if(S.service!=="consult"){
    steps++;
    h += `<div class="wf-step"><h4>${num_(3)} المناطق المطلوبة ${laser?"":`<small>(اختياري)</small>`}</h4><div class="wf-chips">` +
      areasFor(S.service).map(a=>chip("area",`data-id="${a.id}"`, esc(a.ar)+(a.hint?` <small>· ${esc(a.hint)}</small>`:"")+(laser&&a.min?` <small>(${a.min} د)</small>`:"")+(a.small&&!laser?" ·صغيرة":""), S.areas.includes(a.id))).join("") + `</div>`;
    if(laser && S.areas.length){
      const lm = laserMinutes();
      h += `<div class="wf-info"><div>⏱ مدة الجلسة: <b>${lm.total} دقيقة</b></div>${lm.notes.map(n=>`<div>${esc(n)}</div>`).join("")}</div>`;
    }
    if(laser && bikiniLineAlone()) h += `<div class="wf-warn">⚠️ Bikini Line لازم تتحجز مع أريا تانية — اختار معاها أريا.</div>`;
    h += `</div>`;
    if(laser && (!S.areas.length || bikiniLineAlone())){ lastSteps=steps; return h; }
  }
  /* 4 — الدكتور */
  steps++;
  const evals = br.doctors.map((d,i)=>evalDoctor(bk,i));
  const okList = evals.filter(e=>e.ok), noList = evals.filter(e=>!e.ok);
  h += `<div class="wf-step"><h4>${num_(4)} اختيار الدكتورة</h4>`;
  if(okList.length){
    h += `<div class="wf-docs"><button type="button" class="wf-doc${S.doctor==="any"?" on":""}" data-act="doc" data-id="any"><b>أي دكتورة متاحة</b><span class="wf-mini">المساعد يقترح المناسبات حسب الميعاد</span></button>` +
      okList.map(e=>`<button type="button" class="wf-doc${S.doctor===e.di?" on":""}" data-act="doc" data-id="${e.di}"><b>${esc(e.name)}</b> <span class="wf-pill ${e.status==="Open"?"open":"conf"}">${e.status}</span>` +
        `<span class="wf-mini">${esc(docDays(br.doctors[e.di])||"")}</span>` +
        (e.notes.length?`<span class="wf-note">${esc(e.notes.join(" — "))}</span>`:"") + `</button>`).join("") + `</div>`;
  } else h += `<div class="wf-warn">مفيش دكتورة مناسبة للاختيارات دي في ${esc(br.name)}.</div>`;
  if(noList.length) h += `<details class="wf-excl"><summary>مستبعدين (${noList.length})</summary>` +
    noList.map(e=>`<div class="wf-ex"><b>${esc(e.name)}</b> — ${esc(e.reasons.join("، "))}</div>`).join("") + `</details>`;
  h += `</div>`;
  if(S.doctor===null){ lastSteps=steps; return h; }
  /* 5 — التاريخ */
  steps++;
  const tom = addDays(today,1);
  h += `<div class="wf-step"><h4>${num_(5)} تاريخ الميعاد</h4><div class="wf-chips">` +
    chip("date",`data-d="${today}"`,"النهاردة",S.date===today) + chip("date",`data-d="${tom}"`,"بكرة",S.date===tom) +
    `<input type="date" id="wfDate" class="wf-in" value="${S.date||""}" min="${today}"></div>`;
  if(typeof S.doctor==="number"){
    const nx = nextDates(bk,S.doctor,S.date && S.date>=today ? S.date : today,4,28);
    if(nx.length) h += `<div class="wf-mini">أقرب أيام متاحة ليها: </div><div class="wf-chips">` +
      nx.map(x=>chip("date",`data-d="${x.date}"`, esc(dayName(x.date)+" "+fmtDate(x.date).slice(0,5)), S.date===x.date)).join("") + `</div>`;
    else h += `<div class="wf-mini">مفيش أيام متاحة ليها للخدمة دي في الـ ٤ أسابيع الجايين.</div>`;
  }
  h += `</div>`;
  if(!S.date){ lastSteps=steps; return h; }
  /* 6 — الوقت: العميل يختار البداية، والنهاية بتتحسب من مدة الخدمة */
  steps++;
  const dur = sessionMinutes();
  h += `<div class="wf-step"><h4>${num_(6)} وقت بداية الميعاد</h4><div class="wf-time">` +
    `<label>من الساعة <select data-act="tfrom" class="wf-in">${timeOpts(S.from, 15, dur)}</select></label>` +
    `<label>لحد الساعة <b>${S.from!=null ? tLabel(S.from+dur) : "—"}</b> <span class="wf-mini">(مدة الجلسة ${dur} دقيقة — تلقائي)</span></label></div></div>`;
  if(S.from==null){ lastSteps=steps; return h; }
  S.to = S.from + dur;
  /* النتيجة */
  steps++;
  h += resultHtml();
  lastSteps = steps;
  return h;
}

function resultHtml(){
  const bk=S.branch, br=DATA[bk];
  const dstr = dayName(S.date)+" "+fmtDate(S.date);
  if(S.doctor==="any"){
    const cands = br.doctors.map((d,i)=>({i, e:evalDoctor(bk,i)})).filter(x=>x.e.ok).map(x=>({i:x.i, e:x.e, v:verdictFor(bk,x.i,S.date)}));
    const good = cands.filter(c=>c.v.level!=="no"), bad = cands.filter(c=>c.v.level==="no");
    let h = `<div class="wf-step wf-result"><h4>✅ الدكاترة المتاحين — ${esc(dstr)}</h4>`;
    if(good.length){
      h += `<div class="wf-docs">` + good.map(c=>`<button type="button" class="wf-doc" data-act="pickdoc" data-id="${c.i}"><b>${esc(c.e.name)}</b> <span class="wf-pill ${c.v.level==="ok"?"conf":"open"}">${c.v.level==="ok"?"الوقت كله متاح":"جزء من الوقت"}</span>` +
        `<span class="wf-mini">${esc(c.v.overlap.map(o=>rangeLabel(o.from,o.to)).join(" ، "))}</span></button>`).join("") + `</div><div class="wf-mini">دوس على دكتورة تشوف الأكشن والرسالة.</div>`;
    } else h += `<div class="wf-verdict no"><b>❌ مفيش دكتورة متاحة في الميعاد ده</b><div class="wf-mini">جرّب يوم أو وقت تاني، أو اختار فرع تاني.</div></div>`;
    if(bad.length) h += `<details class="wf-excl"><summary>غير متاحين في الميعاد ده (${bad.length})</summary>` + bad.map(c=>`<div class="wf-ex"><b>${esc(c.e.name)}</b> — ${esc(c.v.reasons.join("، "))}</div>`).join("") + `</details>`;
    return h + `<div class="wf-chips"><button type="button" class="wf-chip" data-act="reset">↺ حجز جديد</button></div></div>`;
  }
  const di = S.doctor, d = br.doctors[di], v = verdictFor(bk,di,S.date);
  const cls = v.level, head = cls==="ok" ? "✅ متاح" : cls==="warn" ? "⚠️ متاح بتعديل في الوقت" : "❌ مش متاح";
  let h = `<div class="wf-step wf-result"><div class="wf-verdict ${cls}"><b>${head}</b> — ${esc(d.name)} — ${esc(dstr)}` +
    (v.reasons.length ? `<ul>${v.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>` : "") + `</div>`;
  if(cls==="no"){
    const nx = nextDates(bk,di,addDays(S.date,1),3,28);
    if(nx.length) h += `<div class="wf-mini">أقرب أيام بديلة ليها:</div><div class="wf-chips">` + nx.map(x=>chip("date",`data-d="${x.date}"`,esc(dayName(x.date)+" "+fmtDate(x.date).slice(0,5)))).join("") + `</div>`;
    h += `<div class="wf-chips"><button type="button" class="wf-chip" data-act="anydoc">اعرض دكاترة تانية متاحين</button><button type="button" class="wf-chip" data-act="reset">↺ حجز جديد</button></div></div>`;
    return h;
  }
  const dec = decide(bk,di,S.date);
  h += `<div class="wf-block"><div class="wf-status">حالة الحجز: <span class="wf-pill big ${dec.status==="Open"?"open":"conf"}">${dec.status}</span>${dec.statusNote?` <span class="wf-mini">${esc(dec.statusNote)}</span>`:""}${dec.placeholder?` <span class="wf-pill tmp">قاعدة مؤقتة</span>`:""}</div>` +
    `<h5>الأكشن على السيستم</h5><ol>${dec.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`;
  const warns = dec.warns.concat(v.warnings);
  if(warns.length) h += `<div class="wf-warn">${warns.map(w=>`<div>⚠️ ${esc(w)}</div>`).join("")}</div>`;
  if(dec.info.length) h += `<div class="wf-info">${dec.info.map(w=>`<div>ℹ️ ${esc(w)}</div>`).join("")}</div>`;
  const notes = []; const rl = ruleOf(bk,d);
  if(rl.note) notes.push(rl.note); if(d.notes) notes.push(d.notes); if(d.tempNote) notes.push(d.tempNote);
  if(notes.length) h += `<div class="wf-info">${notes.map(w=>`<div>📝 ${esc(w)}</div>`).join("")}</div>`;
  h += `<div class="wf-block"><h5>السعر</h5>${priceHtml(bk,di)}</div>`;
  h += `<div class="wf-block"><h5>تقول إيه للعميلة</h5>${guidanceHtml()}</div>`;
  h += `<div class="wf-block"><h5>رسالة الحجز</h5><div class="wf-time"><input class="wf-in" data-inp="name" placeholder="اسم العميل" value="${esc(S.name)}"><input class="wf-in" data-inp="phone" placeholder="رقم العميل" inputmode="tel" value="${esc(S.phone)}"></div>` +
    `<textarea id="wfMsg" class="wf-msg" rows="7" readonly>${esc(buildMessage(bk,di,S.date,v,dec))}</textarea>` +
    `<div class="wf-chips"><button type="button" class="wf-chip on" data-act="copy">📋 نسخ الرسالة</button><button type="button" class="wf-chip" data-act="reset">↺ حجز جديد</button></div><div class="wf-mini" id="wfCopyState"></div></div></div>`;
  return h;
}

/* ---------------- تاب الـ Updates ---------------- */
function updatesHtml(){
  const bk=S.branch, br=DATA[bk], t=cairoToday();
  let h = "";
  if(dbState!=="ok") h += `<div class="wf-warn">التخزين السحابي مش متاح دلوقتي — الـ Updates اللي هتضيفها هتفضل على الصفحة دي بس.</div>`;
  const list = UPDATES.filter(u=>u.branch===bk).sort((a,b)=>a.from<b.from?-1:1);

    `<div class="wf-mini">${esc(fmtDate(u.from))}${u.to&&u.to!==u.from?" → "+esc(fmtDate(u.to)):""}${u.type==="hours"&&u.tf!=null?" · "+esc(rangeLabel(+u.tf,+u.tt)):""}${u.note?" — "+esc(u.note):""}</div>` +

  if(!editMode){
    h += `<div class="wf-info">لإضافة Update: افتح وضع التعديل (🔒 تعديل) وادخل الباسورد.</div>`;

  }
  h += `<h4 class="wf-h">إضافة Update</h4><div class="wf-form">` +
    `<label>الدكتورة<select id="wfUpDoc" class="wf-in">${br.doctors.map(d=>`<option value="${esc(d.name)}">${esc(d.name)}</option>`).join("")}</select></label>` +
    `<label>النوع<select id="wfUpType" class="wf-in"><option value="off">غايبة (مش موجودة)</option><option value="stop">وقف حجز لها</option><option value="hours">ساعات مختلفة</option><option value="confirm">الدور فاضي — احجزي Confirmed</option></select></label>` +
    `<label>من تاريخ<input type="date" id="wfUpFrom" class="wf-in" value="${t}"></label>` +
    `<label>لحد تاريخ (اختياري)<input type="date" id="wfUpTo" class="wf-in"></label>` +
    `<label>ساعات مختلفة: من<select id="wfUpTf" class="wf-in">${timeOpts(null)}</select></label>` +
    `<label>ساعات مختلفة: لحد<select id="wfUpTt" class="wf-in">${timeOpts(null)}</select></label>` +
    `<label class="wide">ملاحظة<input type="text" id="wfUpNote" class="wf-in" placeholder="مثال: بلّغتنا مديرة الفرع"></label>` +
    `<button type="button" class="wf-chip on" data-act="addup">➕ إضافة</button><div class="wf-mini" id="wfUpState"></div></div>`;
  return h;
}

function draw(){
  const panel = $("wfPanel"); if(!panel) return;
  ensureBranch();
  const body = $("wfBody"), keep = body.scrollTop;
  const head = `<div class="wf-branchrow"><label>الفرع <select id="wfBranch" class="wf-in">${Object.keys(DATA).map(k=>`<option value="${k}"${k===S.branch?" selected":""}>${esc(DATA[k].name)}</option>`).join("")}</select></label></div>`;
  const prevSteps = lastSteps;
  body.innerHTML = head + (S.tab==="book" ? bookHtml() : updatesHtml());
  document.querySelectorAll("#wfPanel .wf-tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===S.tab?"true":"false"));
  const cnt = UPDATES.filter(u=>u.branch===S.branch && (u.to||u.from)>=cairoToday()).length;
  $("wfUpCount").textContent = cnt ? "("+cnt+")" : "";
  if(S.tab==="book" && lastSteps>prevSteps){
    const els = body.querySelectorAll(".wf-step"); const last = els[els.length-1];
    if(last) setTimeout(()=>last.scrollIntoView({block:"nearest",behavior:"smooth"}),30);
  } else body.scrollTop = keep;
}

/* ---------------- الأحداث ---------------- */
function copyText(txt){
  const done = ok => { const el=$("wfCopyState"); if(el) el.textContent = ok ? "✓ اتنسخت" : "انسخ الرسالة يدويًا من الصندوق"; };
  const fallback = () => { const ta=$("wfMsg"); if(!ta) return done(false); ta.removeAttribute("readonly"); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.setAttribute("readonly",""); done(ok); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>done(true), fallback); else fallback();
}
function refreshMsg(){
  if(typeof S.doctor!=="number" || !S.date || S.from==null) return;
  const v = verdictFor(S.branch,S.doctor,S.date), dec = decide(S.branch,S.doctor,S.date);
  const ta=$("wfMsg"); if(ta) ta.value = buildMessage(S.branch,S.doctor,S.date,v,dec);
}
function onClick(e){
  const t = e.target.closest("[data-act]"); if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if(act==="svc"){ if(S.service!==id){ resetFrom("areas"); S.service=id; } draw(); }
  else if(act==="area"){ if(S.service==="laser") toggleArea(id); else S.areas = S.areas.includes(id) ? S.areas.filter(x=>x!==id) : S.areas.concat(id); resetFrom("doctor"); draw(); }
  else if(act==="gender"){ if(S.gender!==id){ resetFrom("areas"); S.gender=id; } draw(); }
  else if(act==="doc"){ resetFrom("date"); S.doctor = id==="any" ? "any" : +id; draw(); }
  else if(act==="pickdoc"){ S.doctor = +id; draw(); }
  else if(act==="anydoc"){ S.doctor = "any"; draw(); }
  else if(act==="date"){ S.date = t.dataset.d; draw(); }
  else if(act==="copy"){ copyText($("wfMsg").value); }
  else if(act==="reset"){ resetFrom("service"); draw(); $("wfBody").scrollTop=0; }
  else if(act==="delup"){ if(confirm("مسح الـ Update ده؟")){ UPDATES = UPDATES.filter(u=>u.id!==id); saveUpdates(); draw(); } }
  else if(act==="addup"){
    const doc=$("wfUpDoc").value, type=$("wfUpType").value, from=$("wfUpFrom").value, to=$("wfUpTo").value||"";
    const tf=$("wfUpTf").value, tt=$("wfUpTt").value, note=$("wfUpNote").value.trim(), st=$("wfUpState");
    if(!from){ st.textContent="اختار تاريخ البداية."; return; }
    if(to && to<from){ st.textContent="تاريخ النهاية لازم يبقى بعد البداية."; return; }
    if(type==="hours" && (tf===""||tt===""||+tt<=+tf)){ st.textContent="حدد ساعات صحيحة (من قبل لحد)."; return; }
    UPDATES.push({id:"u"+Date.now().toString(36), branch:S.branch, doctor:doc, type, from, to, tf:type==="hours"?+tf:null, tt:type==="hours"?+tt:null, note, ts:Date.now()});
    saveUpdates(); draw();
  }
}
function onChange(e){
  const t = e.target;
  if(t.id==="wfBranch"){ S.branch=t.value; const keep=S.service; resetFrom("areas"); if(keep && !branchHas(S.branch,svcById(keep))) S.service=null; else S.service=keep; draw(); }
  else if(t.id==="wfDate"){ if(t.value){ S.date=t.value; draw(); } }
  else if(t.dataset.act==="tfrom"){ S.from = t.value===""?null:+t.value; S.to = S.from==null ? null : S.from+sessionMinutes(); draw(); }
  else if(t.dataset.act==="tto"){ S.to = t.value===""?null:+t.value; draw(); }
}
function onInput(e){
  const t=e.target;
  if(t.dataset.inp==="name"){ S.name=t.value; refreshMsg(); }
  else if(t.dataset.inp==="phone"){ S.phone=t.value; refreshMsg(); }
}

/* ---------------- تركيب الواجهة ---------------- */
function openPanel(){
  if(!S.service) S.branch = DATA[currentBranch] ? currentBranch : S.branch;
  draw();
  $("wfPanel").classList.add("open"); $("wfOverlay").classList.add("open");
}

function mount(){
  $("wfFab").textContent = WF_EMOJI; $("wfEmoji").textContent = WF_EMOJI;
  $("wfFab").addEventListener("click", openPanel);
