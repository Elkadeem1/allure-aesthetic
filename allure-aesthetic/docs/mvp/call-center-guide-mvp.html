<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل الكول سنتر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F6; --surface:#FFFFFF; --ink:#2B2320; --ink-soft:#6E6259;
    --line:#E8E0DA; --rose:#AD5A66; --rose-deep:#8B4450; --rose-tint:#F6E9EA;
    --sage:#5E7F66; --sage-tint:#E9F1EA; --gold:#B8934F; --gold-tint:#FBF1DE;
    --shadow: 0 1px 2px rgba(43,35,32,.06), 0 6px 20px rgba(43,35,32,.05);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1D1917; --surface:#262120; --ink:#F3ECE8; --ink-soft:#B8ADA6;
      --line:#3A332F; --rose:#D68C97; --rose-deep:#E7A9B2; --rose-tint:#3A2429;
      --sage:#8FB998; --sage-tint:#22302A; --gold:#D9B36C; --gold-tint:#332811;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1D1917; --surface:#262120; --ink:#F3ECE8; --ink-soft:#B8ADA6;
    --line:#3A332F; --rose:#D68C97; --rose-deep:#E7A9B2; --rose-tint:#3A2429;
    --sage:#8FB998; --sage-tint:#22302A; --gold:#D9B36C; --gold-tint:#332811;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: calc(50px + env(safe-area-inset-top, 0px));}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Tajawal', sans-serif;
    line-height:1.7;
  }
  .en{font-family:'Tajawal', sans-serif; font-weight:700;}
  .data, table, .search-box, input{font-family:'Tajawal', sans-serif;}

  header{
    position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top,0px)) 20px 8px;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1000px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-mark{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg, var(--rose), var(--gold));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:900; font-size:13px; flex-shrink:0; font-family:'Tajawal',sans-serif;
  }
  .brand-text h1{font-size:16px; margin:0; font-weight:700;}
  .brand-text p{font-size:11px; margin:1px 0 0; color:var(--ink-soft); font-family:'Tajawal',sans-serif;}

  .branch-tabs{
    max-width:1000px; margin:8px auto 0; display:flex; gap:6px;
    overflow-x:auto; padding-bottom:2px; scrollbar-width:thin;
  }
  .branch-tab{
    flex:0 0 auto; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink-soft); font-family:'Tajawal',sans-serif; font-size:12.5px; font-weight:500;
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .branch-tab[aria-selected="true"]{background:var(--rose); color:#fff; border-color:var(--rose); font-weight:700;}
  .branch-tab:disabled{opacity:.45; cursor:not-allowed;}

  main{max-width:1000px; margin:0 auto; padding:14px 20px 80px;}
  .empty-branch{text-align:center; padding:70px 20px; color:var(--ink-soft); font-family:'Tajawal',sans-serif;}
  .empty-branch .big{font-size:40px; margin-bottom:10px;}

  .branch-head{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .branch-head h2{margin:0 0 4px; font-size:18px;}
  .quick-notes{display:flex; flex-direction:column; gap:4px; margin-top:6px; font-family:'Tajawal',sans-serif;}
  .qn-row{font-size:12px; color:var(--ink-soft); display:flex; gap:6px; align-items:flex-start; line-height:1.5;}
  .qn-row b{color:var(--ink); font-weight:700;}
  .qn-icon{flex-shrink:0;}
  .qn-chips-row{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .mini-pill{background:var(--rose-tint); color:var(--rose-deep); border-radius:6px; padding:1px 7px; font-size:11px; font-weight:700; white-space:nowrap;}

  .search-wrap{position:sticky; top:0; z-index:10; margin: 0 0 18px; position:relative;}
  .search-box{width:100%; padding:13px 44px 13px 16px; border-radius:13px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:14.5px; box-shadow:var(--shadow);}
  .search-box:focus{outline:2px solid var(--rose); outline-offset:1px;}
  .search-icon{position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-soft); pointer-events:none;}

  .section{background:var(--surface); border:1px solid var(--line); border-radius:16px; margin-bottom:14px; overflow:hidden; box-shadow:var(--shadow);}
  .section-toggle{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 18px; background:none; border:none; cursor:pointer; text-align:right; color:var(--ink); font-family:inherit;}
  .section-toggle h3{margin:0; font-size:17px; font-weight:700;}
  .section-toggle .count{font-size:12.5px; color:var(--ink-soft); font-weight:500; font-family:'Tajawal',sans-serif;}
  .chev{transition:transform .18s; color:var(--ink-soft); flex-shrink:0;}
  .section[data-open="true"] .chev{transform:rotate(180deg);}
  .section-body{padding:0 18px 18px; display:none;}
  .section[data-open="true"] .section-body{display:block;}

  .consult-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
  .consult-card{background:var(--rose-tint); border-radius:12px; padding:12px 14px; font-family:'Tajawal',sans-serif;}
  .consult-card .n{font-size:13px; color:var(--rose-deep); font-weight:600;}
  .consult-card .p{font-size:17px; font-weight:800; margin-top:2px;}

  .service-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .service-chip{background:var(--gold-tint); color:#8a6a2c; border-radius:6px; padding:1px 8px; font-size:11px; font-weight:700; border:none; cursor:pointer; font-family:'Tajawal',sans-serif;}
  .service-chip.no-info{cursor:default; opacity:.85;}
  :root[data-theme="dark"] .service-chip{color:var(--gold);}

  .price-note{background:var(--sage-tint); color:var(--sage); border-radius:11px; padding:10px 14px; font-size:13px; margin-bottom:12px; font-family:'Tajawal',sans-serif; font-weight:600;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:9px 10px; text-align:right; border-bottom:1px solid var(--line);}
  .th-date{display:block; font-size:10.5px; font-weight:500; color:var(--ink-soft); margin-top:1px; font-family:'Tajawal',sans-serif;}
  th{color:var(--ink-soft); font-weight:600; font-size:12.5px;}
  tr:last-child td{border-bottom:none;}
  .price-row{cursor:pointer;}
  .price-row:hover{background:var(--bg);}
  .price-cell{font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .no-results{padding:24px 10px; text-align:center; color:var(--ink-soft); font-size:13.5px; font-family:'Tajawal',sans-serif;}

  .sched-table th, .sched-table td{text-align:center; font-size:12.5px;}
  .sched-table td:first-child, .sched-table th:first-child{text-align:right; font-weight:700;}
  .today-col{ background:rgba(184,134,68,0.14) !important; }
thead .today-col{ background:rgba(184,134,68,0.28) !important; font-weight:800; }
.sched-off{color:var(--ink-soft); opacity:.6;}
  .sched-dash{color:var(--line);}
  .doctor-notes{margin:14px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; font-family:'Tajawal',sans-serif; font-size:13px; color:var(--ink-soft);}
  .doctor-notes li b{color:var(--ink); font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px;}

  .rules-list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px; font-family:'Tajawal',sans-serif;}
  .rules-list li{padding-right:20px; position:relative; font-size:14px;}
  .rules-list li::before{content:"◆"; position:absolute; right:0; top:7px; color:var(--rose); font-size:9px;}
  .rules-list b{color:var(--rose-deep); font-family:'Tajawal',sans-serif; font-weight:700;}

  footer{text-align:center; padding:24px; color:var(--ink-soft); font-size:12px; font-family:'Tajawal',sans-serif;}

  .overlay{position:fixed; inset:0; background:rgba(20,15,13,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .info-panel{
    position:fixed; top:0; right:0; height:100%; width:min(400px,92vw);
    background:var(--surface); box-shadow:-8px 0 30px rgba(0,0,0,.15);
    transform:translateX(100%); transition:transform .25s ease; z-index:50;
    overflow-y:auto; padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));
  }
  .info-panel.open{transform:translateX(0);}
  .info-panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .info-panel-head h2{margin:0; font-size:22px; color:var(--rose-deep);}
  .info-close{background:var(--bg); border:1px solid var(--line); border-radius:10px; width:32px; height:32px; font-size:16px; cursor:pointer; color:var(--ink-soft); flex-shrink:0;}
  .info-price-note{background:var(--sage-tint); color:var(--sage); border-radius:11px; padding:10px 14px; font-size:13.5px; margin-bottom:16px; font-family:'Tajawal',sans-serif; font-weight:600;}
  .info-section{margin-bottom:16px; font-family:'Tajawal',sans-serif;}
  .info-section h4{margin:0 0 8px; font-size:14px; color:var(--ink); border-bottom:2px solid var(--rose-tint); padding-bottom:6px;}
  .info-section ul{margin:0; padding-right:18px; display:flex; flex-direction:column; gap:6px;}
  .info-section li{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .info-empty{color:var(--ink-soft); font-size:13.5px; font-family:'Tajawal',sans-serif; text-align:center; padding:30px 10px;}

  @media (max-width:480px){
    .branch-head{padding:15px;}
    main{padding:16px 14px 70px;}
  }

  /* ---------- تبديل العرض (فروع / مهارات المكالمة) ---------- */
  .view-switch{display:flex; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:4px; flex-shrink:0;}
  .view-btn{border:none; background:none; color:var(--ink-soft); font-family:'Tajawal',sans-serif; font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .view-btn[aria-selected="true"]{background:var(--rose); color:#fff;}
  @media (max-width:560px){ .header-row{flex-wrap:wrap;} .view-switch{order:3; width:100%; justify-content:center;} }

  /* ---------- عناصر دليل مهارات المكالمة ---------- */
  .manual-nav{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .manual-nav button{background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); font-family:'Tajawal',sans-serif; font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:10px; cursor:pointer;}
  .manual-nav button[aria-selected="true"]{background:var(--rose-tint); color:var(--rose-deep); border-color:var(--rose-tint);}

  .box{border-radius:12px; padding:12px 15px; margin:10px 0; font-family:'Tajawal',sans-serif; font-size:13.5px; line-height:1.7;}
  .box-title{font-weight:800; font-size:12px; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .box-script{background:#EAF1FB; color:#2B4C7E;}
  :root[data-theme="dark"] .box-script{background:#1C2A3D; color:#9EC1F2;}
  .box-tip{background:var(--sage-tint); color:#2E5B3B;}
  :root[data-theme="dark"] .box-tip{color:var(--sage);}
  .box-warn{background:var(--gold-tint); color:#8a5a1c;}
  :root[data-theme="dark"] .box-warn{color:var(--gold);}
  .box-danger{background:#FBEAEA; color:#8B2E2E; font-weight:700;}
  :root[data-theme="dark"] .box-danger{background:#3A1E1E; color:#E38080;}
  .box p, .box div{margin:0;}
  .box ul{margin:4px 0 0; padding-right:18px;}
  .box li{margin-bottom:4px;}

  .legend-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .legend-chip{font-family:'Tajawal',sans-serif; font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px;}

  .scn-card{border:1px solid var(--line); border-radius:13px; padding:14px 16px; margin-bottom:12px;}
  .scn-head{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;}
  .scn-head h4{margin:0; font-size:15px; font-family:'Tajawal',sans-serif; font-weight:700;}
  .scn-num{font-family:'Tajawal',sans-serif; font-size:11px; color:var(--ink-soft); font-weight:700;}
  .scn-body{display:none; margin-top:10px; font-family:'Tajawal',sans-serif; font-size:13.5px;}
  .scn-card[data-open="true"] .scn-body{display:block;}
  .scn-meta{color:var(--ink-soft); font-size:13px; margin-bottom:8px;}
  .scn-meta b{color:var(--ink);}
  .scn-steps{margin:0 0 10px; padding-right:18px;}
  .scn-steps li{margin-bottom:5px;}

  .manual-table th, .manual-table td{font-family:'Tajawal',sans-serif; vertical-align:top;}
  .manual-section-title{font-size:20px; margin:0 0 4px;}
  .manual-section-sub{font-family:'Tajawal',sans-serif; color:var(--ink-soft); font-size:13px; margin:0 0 16px;}

  /* ---------- وضع التعديل ---------- */
  .edit-lock-btn{background:var(--bg); border:1px solid var(--line); color:var(--ink-soft); font-family:'Tajawal',sans-serif; font-size:12px; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer; flex-shrink:0;}
  .edit-lock-btn.active{background:var(--sage); color:#fff; border-color:var(--sage);}
  [contenteditable="true"]{outline:1px dashed var(--rose); outline-offset:2px; border-radius:4px; cursor:text; background:var(--rose-tint);}
  [contenteditable="true"]:focus{outline:2px solid var(--rose); background:var(--surface);}
  .edit-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    background:var(--surface); border-top:2px solid var(--sage);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    display:none; align-items:center; gap:10px; flex-wrap:wrap;
    box-shadow:0 -6px 20px rgba(0,0,0,.12); font-family:'Tajawal',sans-serif;
  }
  .edit-bar.open{display:flex;}
  .edit-bar-label{font-size:12px; color:var(--sage); font-weight:700; flex:1 1 200px;}
  .edit-bar-status{font-size:11.5px; color:var(--ink-soft);}
  .edit-bar-btn{border:none; border-radius:9px; padding:8px 14px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; background:var(--bg); color:var(--ink-soft); border:1px solid var(--line);}
  .edit-bar-btn.save{background:var(--sage); color:#fff; border-color:var(--sage);}
  .add-row-btn, .del-btn{border:1px dashed var(--line); background:none; color:var(--ink-soft); font-family:'Tajawal',sans-serif; font-size:12px; font-weight:700; border-radius:8px; padding:6px 10px; cursor:pointer;}
  .del-btn{border:none; color:#b23; font-size:14px; padding:2px 6px;}
  body{padding-bottom:0;}
  body.edit-active{padding-bottom:60px;}

  .header-sub{max-width:1000px; margin:4px auto 0; direction:ltr; text-align:left; font-family:'Tajawal',sans-serif; line-height:1.2;}
  .header-sub .clock-box{display:inline-block; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:3px 10px; text-align:center;}
  .header-sub .clock-date{display:block; direction:rtl; font-size:11px; font-weight:600; color:var(--ink-soft);}
  .header-sub .clock-time{display:block; direction:rtl; font-size:14px; font-weight:800; color:var(--rose); font-variant-numeric:tabular-nums;}
  @media (max-width:560px){ .header-sub .clock-date{font-size:10px;} .header-sub .clock-time{font-size:13px;} }

  .week-nav{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px; font-family:'Tajawal',sans-serif;}
  .week-nav button{background:var(--bg); border:1px solid var(--line); color:var(--ink-soft); border-radius:8px; padding:6px 11px; font-size:13px; cursor:pointer; font-family:inherit;}
  .week-nav .week-range{font-size:13px; font-weight:700; color:var(--ink); min-width:150px; text-align:center;}
  .week-nav .week-reset{color:var(--rose-deep); border-color:var(--rose-tint); background:var(--rose-tint);}
  .sched-override{background:var(--gold-tint) !important;}

  /* ---------- مساعد الحجز ---------- */
  .wf-fab{position:fixed; left:16px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:35; width:56px; height:56px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--rose),var(--gold)); color:#fff; font-size:27px; line-height:1; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.28);}
  body.edit-active .wf-fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));}
  .wf-overlay{position:fixed; inset:0; background:rgba(20,15,13,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:54;}
  .wf-overlay.open{opacity:1; pointer-events:auto;}
  .wf-panel{position:fixed; top:0; left:0; height:100%; width:min(500px,100vw); background:var(--surface); box-shadow:8px 0 30px rgba(0,0,0,.18); transform:translateX(-100%); visibility:hidden; transition:transform .25s ease, visibility 0s .25s; z-index:55; display:flex; flex-direction:column; font-family:'Tajawal',sans-serif; color:var(--ink);}
  .wf-panel.open{transform:translateX(0); visibility:visible; transition:transform .25s ease;}
  .wf-head{display:flex; align-items:center; justify-content:space-between; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px; border-bottom:1px solid var(--line);}
  .wf-title{font-size:18px; font-weight:800;}
  .wf-x{background:none; border:1px solid var(--line); color:var(--ink-soft); border-radius:10px; width:34px; height:34px; font-size:15px; cursor:pointer;}
  .wf-tabs{display:flex; gap:6px; padding:8px 16px; border-bottom:1px solid var(--line);}
  .wf-tabs button{flex:1; border:1px solid var(--line); background:var(--bg); color:var(--ink-soft); border-radius:10px; padding:8px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;}
  .wf-tabs button[aria-selected="true"]{background:var(--rose); border-color:var(--rose); color:#fff;}
  .wf-body{flex:1; overflow-y:auto; padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px));}
  body.edit-active .wf-body{padding-bottom:90px;}
  .wf-branchrow label, .wf-time label, .wf-form label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--ink-soft); font-weight:700;}
  .wf-in{font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); min-width:0;}
  .wf-step{margin-top:14px; padding:12px; border:1px solid var(--line); border-radius:14px; background:var(--bg);}
  .wf-step h4, .wf-h{margin:0 0 8px; font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .wf-step h4 small{font-weight:500; color:var(--ink-soft);}
  .wf-n{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--rose); color:#fff; font-size:12px;}
  .wf-chips{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0;}
  .wf-chip{font-family:inherit; font-size:13px; font-weight:700; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;}
  .wf-chip.on{background:var(--rose); border-color:var(--rose); color:#fff;}
  .wf-chip.dis{opacity:.4; cursor:not-allowed;}
  .wf-mini{font-size:12px; color:var(--ink-soft); font-weight:500; margin-top:4px;}
  .wf-docs{display:flex; flex-direction:column; gap:6px;}
  .wf-doc{text-align:right; font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); cursor:pointer; display:flex; flex-direction:column; gap:2px;}
  .wf-doc.on{border-color:var(--rose); box-shadow:0 0 0 2px var(--rose-tint);}
  .wf-note{font-size:11.5px; color:var(--gold); font-weight:600;}
  .wf-pill{display:inline-block; font-size:11px; font-weight:800; padding:1px 8px; border-radius:999px; vertical-align:middle;}
  .wf-pill.open{background:var(--gold-tint); color:#8a6a2c;}
  .wf-pill.conf{background:var(--sage-tint); color:var(--sage);}

    steps:["حدد الخدمة (السعر بيختلف: المنطقة، الكمية، الحالة).","قول السعر من القائمة المعتمدة (أو «بيبدأ من»).","وضّح إن التقييم الطبي هو اللي بيحدد السعر النهائي.","اعرض الاستشارة."],
    script:"العميل: بكام الفيلر؟\nأنت: سؤال مهم ومن حقك تعرفه. سعر الفيلر يبدأ من [..] ويتحدد حسب المنطقة والكمية اللي الدكتور يقيّمها لحالة حضرتك في الاستشارة. تحب أحجزلك استشارة يوضحلك فيها كل حاجة؟\n\nاعتراض «غالي» — أنت: فاهم إن السعر عامل مهم لحضرتك. اللي بيخلّي الخدمة عندنا مختلفة إنها بإشراف طبي متخصص وبروتوكولات تعقيم ومكافحة عدوى صارمة. تحب أشوفلك لو في عرض متاح حاليًا؟",
    forbidden:["ما تقولش رقم من دماغك أو «تقريباً كذا».","ما تدّيش خصم أو عرض خارج القائمة.","ما تقارنش بأسعار مراكز تانية ولا تقلل منها."],
    escalation:"أي طلب خصم خارج العروض المعتمدة إسأل مديرك."},
  {id:"٥-٦", title:"«أنا ينفع أعمل الإجراء ده؟» (ملاءمة طبية)", goal:"تطمّنه من غير ما تدّي رأي طبي، وتجمّع المعلومة العامة، وتوصله للدكتور.",
    steps:["اعترف بالسؤال: «سؤال مهم جداً.»","وضح إن التقييم الطبي للدكتور.","اسأل سؤال واحد: «إيه الخدمة اللي عايزها؟»","احجز استشارة أو رتّب مكالمة من الدكتور/التمريض.","سجل النقطة في ملاحظة الحجز."],
    script:"حمل أو رضاعة — العميل: أنا حامل، ينفع أعمل بوتوكس؟\nأنت: شكراً إن حضرتك قلتيلي، ده مهم جداً. الحمل والرضاعة من الحالات اللي الدكتور بيقيّمها بدقة، فمقدرش أقول ينفع ولا لأ. هحجزلك استشارة، وهسجّل الملاحظة دي علشان الدكتور يبقى عارف من الأول.",
    forbidden:["«ينفع» أو «مينفعش» أبداً، حتى لو الحالة شكلها بسيطة.","تنصح بإيقاف أو بدء أي دوا أو مكمل.","تدّي أمثلة («واحدة صاحبتي عملتها وهي حامل»)."],
    escalation:"لو العميل عنده أعراض حاليًا (ألم، تورم، تغيّر لون) → سيناريو ٥-١٠ فورًا."},
  {id:"٥-٧", title:"«هتدي نتيجة؟ هتروح نهائي؟»", goal:"تكون صادق، من غير تحطيم حماسه ولا وعد كاذب.",
    script:"العميل: هيروح الشعر نهائي؟ وكام جلسة؟\nأنت: فاهم إن حضرتك عايز تتطمن على النتيجة، وده حقك تمامًا. النتيجة بتختلف من شخص لشخص، وعدد الجلسات بيحدده الدكتور بعد التقييم. اللي أقدر أوعد بيه إن الدكتور هيقيّم حالة حضرتك ويوضحلك المتوقع بصراحة.",
    forbidden:["«نهائي» / «مضمون» / «١٠٠٪» / «هتبقى زي الصورة».","تحدد عدد جلسات أو مدة نتيجة."]},
  {id:"٥-٨", title:"«بيوجّع؟ وهبقى إزاي بعده؟»", goal:"تطمّنه بصدق، وتنقل له التعليمات المعتمدة اللي ممكن تتقال بأمان.",
    script:"العميل: أنا بخاف من الحقن، بيوجع؟\nأنت: فاهم إن الموضوع مقلق، وسؤال حضرتك في محله. الإحساس بيختلف من شخص لشخص، والدكتور بيشرح لحضرتك كل حاجة قبل ما يبدأ.",
    forbidden:["«مش هتحس بحاجة» / «بيوجع جامد» / «تقدر ترجع شغلك على طول» (ده حكم طبي)."]},
  {id:"٥-٩", title:"سؤال عن التعليمات بعد الجلسة (عميل قديم)", goal:"تنقل التعليمات المعتمدة زي ما هي، وتتأكد إنه فاهم.",
    steps:["تحقق من الهوية وحدد أنهي خدمة وإمتى.","اقرا التعليمات المعتمدة بالحرف، من غير تفصيل شخصي.","Teach-back: اطلب منه يكرر أهم نقطتين.","اسأل مباشر: «حضرتك ملاحظ أي حاجة غير مريحة دلوقتي؟»","لو قال أي عرض ← سيناريو ٥-١٠. لو لأ ← وثّق."],
    script:"العميل: أنا عملت ليزر امبارح، ينفع أروح البحر؟\nأنت: التعليمات المعتمدة بعد الليزر إن حضرتك تتجنب الشمس المباشرة وتستخدم واقي شمس عالي لمدة أسبوعين، وتتجنب الحمامات الساخنة جدًا والساونا ٢٤-٤٨ ساعة. ممكن تكررلي أهم نقطتين علشان أتأكد إني وضّحت؟",
    forbidden:["تجاوب على أسئلة زي «أقدر أحط كريم كذا؟» بحكم شخصي، إلا لو في تعليمات مباشرة.","تقول «ده طبيعي» لأي حاجة بيوصفها."]},
  {id:"٥-١٠", title:"أعراض أو مضاعفات بعد جلسة (أخطر سيناريو)", goal:"تتصرف بهدوء وسرعة، ما تشخّصش، ما تطمّنش كذب، وتوصّل المعلومة للدكتور فورًا.",
    danger:"علامات الطوارئ الفورية (Red Flags): صعوبة في التنفس — تورم في الوجه أو الشفايف أو اللسان — دوخة شديدة أو إغماء — ألم شديد ومفاجئ — شحوب شديد أو تغيّر في لون الجلد بعد الفيلر.\n\nأنت: أستاذ/ة [الاسم]، اللي حضرتك بتوصفه محتاج تدخل طبي فوري. من فضلك اتصل بالإسعاف على ١٢٣ أو روح أقرب طوارئ حالاً. أنا هبلّغ الدكتور المعالج والمدير الطبي دلوقتي. حضرتك معاك حد دلوقتي؟\n\nبلغ مديرك فورًا.",
    steps:["لو مفيش Red Flag: اهدى وطمّنه إنك سمعته.","اجمع ٥ معلومات بس: الاسم والرقم — الفرع — الخدمة — وقت الجلسة ومين الدكتور — الأعراض بكلام العميل نفسه ومن إمتى.","بلغ الدكتور أو مدير الفرع فورًا (مش آخر اليوم).","اتفق مع العميل على خطوة واضحة: مين هيتصل بيه وخلال قد إيه.","وثق كلام العميل بالكامل، وتأكد إن المدير الطبي اتبلغ في نفس اليوم.","تابع: اتأكد إن الدكتور فعلاً تواصل مع العميل."],
    script:"سكريبت الأعراض بدون Red Flag — أنت: فاهم إن ده مقلق، وشكراً لحضرتك إنك بلغتنا فورًا. أنا هبلغ الدكتور حالاً، وهيتواصل مع حضرتك خلال [X] دقيقة على نفس الرقم. ولو الأعراض زادت قبل ما نتصل، كلمنا فورًا أو روح أقرب طوارئ.",
    forbidden:["«ده طبيعي» / «متقلقش» / «استنى كام يوم وشوف».","تنصح بدوا أو كريم أو مضاد حيوي أو أي حاجة.","تشخص السبب أو تناقش مسؤولية.","تعد بتعويض أو استرداد.","تقفل المكالمة قبل ما التصعيد يتم."],
    escalation:"الإسعاف ١٢٣ (للعميل) + الدكتور المعالج/المناوب + المدير الطبي + مديرك — فورًا، قبل أي حاجة تانية."},
  {id:"٥-١١", title:"الشكوى (إطار HEAR)", goal:"لازم العميل يحس إنه اتسمع واتحل موضوعه أو جاري العمل على حله.",
    steps:["H — Hear: اسمع من غير مقاطعة، واكتب.","E — Empathize: اعترف بإحساسه.","A — Apologize: اعتذر عن التجربة مش عن اعتراف بخطأ طبي.","R — Resolve: اعرض حل أو خطوة واضحة بميعاد، أو صعد للمسؤول.","سجّل الشكوى: الاسم، الرقم، الفرع، تاريخ الواقعة، وصف بكلام العميل، المطلوب."],
    script:"العميل: استنيت في الفرع ساعة كاملة وماحدش اعتذر لي!\nأنت: معاك حق تتضايق، وأنا بعتذر لحضرتك جدًا على التجربة دي. علشان أتابع الموضوع صح، ممكن أعرف يوم إيه وفي أنهي فرع؟ أنا هسجّل الشكوى حالاً وأرفعها لمدير الفرع، وهيتواصل مع حضرتك خلال [المدة المعتمدة].",
    forbidden:["تدافع أو تبرر («الفرع كان زحمة»).","تلوم زميل أو فرع.","تعد بحاجة مش في إيدك (تعويض، فصل موظف).","تقول «هعرف الإدارة» من غير ما تسجل فعلاً."],
    escalation:"أي شكوى فيها مضاعفات طبية، أو تهديد قانوني/إعلامي، أو تصوير → Team Leader ومدير الفرع فورًا."},
  {id:"٥-١٢", title:"العميل الغضبان أو اللي بيزعق", goal:"تهدّي الموقف من غير ما تتخلى عن دورك، وتوصل لحل أو تصعيد منظم.",
    steps:["سيبه يفرّغ ٦٠-٩٠ ثانية من غير مقاطعة.","وقفة + نفس + نبرة أهدى.","اسمه + اعتراف: «معاك حق تتضايق يا أستاذ/ة [الاسم].»","ركّز على الحل: «خلّيني أفهم بالظبط اللي حصل.»","اعرض خيار وخطوة بميعاد.","لو استمر الغضب ورفض الحل → اعرض التحويل للمدير."],
    script:"العميل: أنتوا ناس مش محترمين! أنا حجزت من أسبوع وتقولولي مفيش حجز!\nأنت: أستاذ/ة [الاسم]، معاك حق تتضايق جدًا، وأنا بعتذر لحضرتك. خلّيني أشوف الموضوع فورًا.\n\nلو طلب المسؤول — أنت: طبعًا، من حقك تمامًا. هاقدم لحضرتك طلب دلوقتي، وهبلغه بالتفاصيل علشان حضرتك ما تعيدش الكلام.",
    forbidden:["ما ترفضش تحويل العميل للمسؤول أبدًا.","ما ترد بنفس النبرة أو تقول «حضرتك بتزعق».","ما تسكتش بعد ما يخلص، بل رد بجملة تعاطف."]},
  {id:"٥-١٣", title:"العميل المتردد", goal:"تفهم سبب التردد الحقيقي، وتقلل الخوف من الالتزام، من غير أي ضغط.",
    steps:["اسأل: «إيه النقطة اللي لسه شاغلة حضرتك؟»","حدد السبب: سعر؟ خوف؟ توقيت؟ رأي حد؟","عالج السبب بمعلومة صادقة.","قلل الالتزام: «الاستشارة مش معناها إنك لازم تعمل الإجراء.»","استأذنه في متابعة لطيفة."],
    script:"العميل: هفكر وأرجعلك.\nأنت: طبعًا، القرار قرار حضرتك. علشان أساعدك تفكر صح، ممكن أعرف النقطة اللي لسه محتاجة توضيح؟",
    forbidden:["ضغط أو عروض مزيفة («العرض بينتهي النهارده» لو مش حقيقي).","تتصل بالعميل أكتر من المتفق عليه."]},
  {id:"٥-١٤", title:"المقارنة بمنافس أو برأي دكتور آخر", goal:"تحافظ على مصداقيتك من غير هجوم على حد.",
    script:"العميل: مركز تاني قالي إنهم أرخص وبيدوني ضمان.\nأنت: أنا مقدرش أعلق على مراكز تانية لأني ماعنديش معلومات عنها. اللي أقدر أقوله إن عيادات ألور بإشراف طبي متخصص، وبروتوكولات تعقيم ومكافحة عدوى صارمة. وأنصح حضرتك تاخد الاستشارة وتقارن بنفسك.",
    forbidden:["«إحنا أحسن من...» أو أي انتقاد لمركز أو دكتور.","تعد بضمان أو تسعير مقابل منافس."],
    escalation:"لو العميل بيذكر تقييم سلبي عن ألور نفسها، عامله كشكوى (٥-١١)."},
  {id:"٥-١٥", title:"«عايز أكلم الدكتور مباشرة»", goal:"تلبي احتياجه بطريقة منظمة من غير ما تعطل الدكتور في جلسة.",
    steps:["اعرف الموضوع بشكل مختصر.","لو في أعراض ← ٥-١٠ فورًا.","لو سؤال غير عاجل: رتّب مكالمة من الدكتور/التمريض أو استشارة.","إبعت التفاصيل ع الواتساب للدكتور أو مدير الفرع."],
    script:"أنت: الدكتور غالبًا بيكون في جلسات مع مرضى، علشان كده مقدرش أحوّل المكالمة مباشرة، لكن أقدر أرتّب مكالمة منه أو من التمريض على رقم حضرتك، أو أحجزلك استشارة.",
    forbidden:["تحوّل مكالمة العميل للدكتور وهو في جلسة من غير تنسيق.","تجاوب بدل الدكتور علشان «تخلص الموضوع»."]},
  {id:"٥-١٦", title:"حد غير العميل بيسأل عن ميعاد أو بيانات", goal:"حماية خصوصية العميل من غير ما تكون جاف.",
    script:"العميل: هي عندكم ميعاد إمتى؟ أنا أختها.\nأنت: أهلاً بحضرتك. حفاظًا على خصوصية عملائنا، مقدرش أؤكد أو أفصح عن أي بيانات إلا لصاحب الحجز نفسه. لو متاح ممكن هي تكلمنا مباشرة.",
    forbidden:["ما تأكدش ولا تنفي إن الشخص عميل.","ما تفصحش عن الخدمة أو الميعاد حتى لو الطرف بيبكي أو بيلحّ."],
    escalation:"لو في تفويض مكتوب من العميل أو حالة استثنائية، بلغ مديرك فورًا وهو يقرر."},
  {id:"٥-١٧", title:"العميل كتير الكلام", goal:"تحترمه وتوجه المكالمة من غير ما تقاطعه بشكل ملحوظ.",
    steps:["اسمع دقيقة، وبعدين قاطعه بلطف باسمه.","لخّص أهم نقطة وارجع للمطلوب.","استخدم أسئلة مغلقة تضيق المكالمة."],
    script:"أنت: معلش أقاطع حضرتك لحظة يا أستاذ/ة [الاسم] علشان أستفيد من وقتك وأخدم طلبك صح. اللي فهمته إن أهم حاجة عند حضرتك هي [..]. تحب أحجزلك استشارة دلوقتي؟",
    forbidden:["تنهي المكالمة فجأة أو تظهر إنك مش مهتم.","تتنهد أو تقول «اختصر يا فندم»."]},
  {id:"٥-١٨", title:"العميل المتوتر لأول مرة / كبير السن / مش فاهم", goal:"تحسسه بالأمان وتتأكد إنه فهم فعلاً.",
    steps:["تكلم أبطأ وأوضح، وقسّم المعلومة لأجزاء صغيرة.","كرر النقط المهمة (الميعاد، العنوان) بلطف.","اطلب منه يكرر (Teach-back).","اقترح تبعت التفاصيل على رسالة، أو لفرد من العيلة بإذنه."],
    script:"أنت: ولا يهمك يا أستاذ/ة [الاسم]، خد وقتك وأنا معاك خطوة خطوة. الدكتور هيشرحلك كل حاجة قبل أي إجراء، ومفيش أي حاجة بتتعمل من غير موافقة حضرتك.",
    forbidden:["تستعجله أو تتنهد.","تقول «كنت قلتلك» أو «مش فاهم ليه؟»"]},
  {id:"٥-١٩", title:"مواضيع حساسة: مناطق خاصة، جنس مقدم الخدمة، الرجال", goal:"تتعامل باحترام كامل، من غير تعليق ولا فضول ولا إحراج.",
    script:"العميل: أنا محرجة شوية... عايزة أسأل عن ليزر في منطقة حساسة.\nأنت: ولا يهمك خالص يا أستاذة [الاسم]، خصوصية حضرتك عندنا مضمونة، والفريق بيتعامل مع كل الحالات بمنتهى الاحترافية. تحبي أسجل طلب إن الجلسة تكون مع [دكتورة/فنية]؟",
    forbidden:["تعلّق أو تضحك أو تسأل عن تفاصيل شخصية.","تعد بمقدم خدمة معين قبل تأكيد الفرع.","تفرّق في التعامل بين رجالة وستات — المعايير واحدة."]},
  {id:"٥-٢٠", title:"طلب خصم أو عرض", goal:"تكون صادق، وتقول العروض الفعلية بس، وتصعّد الطلبات الخاصة.",
    script:"العميل: ممكن تدّيني خصم؟\nأنت: العروض المتاحة حاليًا هي [العروض الموجودة حاليًا]. لو حضرتك حابب نحجز...",
    forbidden:["تعد بخصم من عندك أو «هدبّرلك».","تخترع عرض لإرضاء العميل.","تقارن أسعار الفروع لو مش مؤكد."],
    escalation:"طلب خصم خارج العروض → Team Leader."},
  {id:"٥-٢١", title:"مش عارف الإجابة / السيستم واقع", goal:"ما تخترعش ولا تخسر ثقة العميل.",
    script:"مش عارف — أنت: أنا آسف جدًا، عندنا مشكلة بسيطة في السيستم هتتحل في أقرب وقت، وعايز أدي حضرتك معلومة دقيقة. خليني أتأكد الأول.\n\nالسيستم واقع — أنت: السيستم عندنا بيعمل تحديث دلوقتي. مش هيأثر على حجز حضرتك: هسجّل طلب الحجز يدويًا وأأكده معاك خلال [المدة].",
    tip:"إجراء تعطل السيستم: نسجل في شيت إكسيل بنفس البيانات، وأدخله في السيستم أول ما يرجع.",
    forbidden:["تخمن معلومة أو تقول «على حسب علمي» في حاجة طبية أو مالية."]},
  {id:"٥-٢٢", title:"استرداد أموال أو مشكلة في الدفع", goal:"تسجل الموضوع بدقة وتوصله للمسؤول الصح من غير وعد بحاجة مش في إيدك.",
    steps:["اسمع واعتذر عن الموقف.","اجمع: الاسم، الرقم، الفرع، التاريخ، الخدمة، المبلغ، المشكلة.","وضّح إن الموضوع هيتراجع من الحسابات/مدير الفرع وحدد ميعاد رد.","سجّل وصعّد."],
    script:"أنت: بعتذر لحضرتك على المشكلة دي. علشان أراجعها صح، ممكن الاسم والرقم والفرع وتاريخ الدفع والمبلغ؟ أنا هسجّل الموضوع وأرفعه للمسؤول، وهيتواصل مع حضرتك خلال [المدة المعتمدة].",

واكيوتان) حاليًا أو أخده في الفترة الأخيرة، وسجل المعلومة للدكتور"], ["قبل", "اسأل عن وجود تاريخ للإصابة بـ Herpes وسجل المعلومة للدكتور"], ["قبل", "البشرة السمراء أو الداكنة تحتاج تقييم وتحضير مناسب قبل الجلسة"], ["قبل", "لازم يكون العميل عارف فترة التعافي قبل اختيار الموعد، وتجنب الحجز قبل مناسبة مهمة مباشرة بسبب الاحمرار والتقشير المتوقع"], ["بعد", "استخدام كريمات الترميم اللي وصفها الدكتور، وممنوع إزالة أو شد القشر باليد"], ["بعد", "ممنوع التعرض المباشر للشمس، مع الالتزام بتعليمات الدكتور واستخدام Sunblock"], ["بعد", "يفضل تجنب المكياج لحوالي أسبوع أو حسب تعليمات الدكتور، وممنوع استخدام Retinol أو Acids إلا بعد السماح من الدكتور"]], "say": [["هقعد في البيت قد إيه؟", "غالبًا من 5-7 أيام، والوجه ممكن يكون محمر ويحصل تقشير، فالأفضل اختيار موعد مفيهوش مناسبات قريبة"], ["هيشيل آثار الحبوب خالص؟", "الفراكشنال بيحسن آثار الحبوب والندبات بشكل واضح، لكن درجة التحسن بتختلف حسب عمق الآثار والحالة، والدكتور يقدر يحدد التوقعات المناسبة بعد التقييم"], ["عندي زوائد جلدية في الرقبة، ينفع تتشال؟", "ممكن يتم التعامل مع الـ Skin Tags، والسعر بيكون حسب العدد، والدكتور بيقيّمها أثناء الكشف ويتأكد من طبيعتها قبل الإجراء"], ["أعمله في الصيف؟", "ممكن حسب تقييم الدكتور وقدرة العميل على الالتزام بتعليمات الحماية من الشمس، وناس كتير بتفضّل عمله في الخريف والشتاء بسبب صعوبة الالتزام بالشمس في الصيف"]], "escalate": "صديد، سخونية أو حرارة واضحة، ألم بيزيد بدل ما يقل، فقاقيع تشبه الـ Herpes، أو احمرار شديد ومستمر بعد فترة التعافي المتوقعة أو بشكل غير طبيعي", "review": ["فترة التعافي المتوقعة للـ CO2 قد إيه؟", "ليه لازم توضح فترة التعافي قبل الحجز؟", "اذكر دواء لازم تسأل عنه قبل الجلسة.", "لو اتعملت مع Exosomes أو PRP أو Mesotherapy، السعر بيتحسب إزاي؟"]}, {"id": "laser_vascular", "name": "ليزر الشعيرات الدموية (Vascular Laser)", "branch": null, "summary": "نفس جهاز Cynosure Elite+ المستخدم في إزالة الشعر، بس بإعدادات مخصصة للشعيرات الدموية. الليزر بيستهدف الشعيرات الدموية الصغيرة الظاهرة في الجلد، وبيساعد على تقليلها تدريجيًا بعد الجلسة.", "details": [["دواعي الاستخدام", "الشعيرات الدموية الظاهرة تحت العين، الشعيرات الرفيعة في الرجلين، بعض الشعيرات الظاهرة في الوجه، والشعيرات السطحية الصغيرة حسب تقييم الدكتور. الدوالي الكبيرة أو الحالات غير الواضحة لازم يشوفها الدكتور الأول قبل حجز الجلسة"], ["عدد الجلسات", "غالبًا من جلسة لـ 3 جلسات، بيختلف حسب الحالة والاستجابة، والدكتور بيحدد العدد المناسب بعد التقييم"], ["الجهاز", "Cynosure Elite+، نفس جهاز Laser Hair Removal، لكن بإعدادات مختلفة مخصصة للأوعية والشعيرات الدموية، وسعر النبضة مختلف عن سعر نبضة إزالة الشعر"], ["النتيجة", "مش بتظهر بالضرورة فورًا، الشعيرات بتبدأ تخف تدريجيًا خلال الأسابيع التالية للجلسة، وممكن تحتاج الحالة لأكتر من جلسة حسب الاستجابة"], ["مش مناسب لـ / لازم تتراجع مع الدكتور", "الحمل، وجود حرق أو تعرض قوي للشمس في المنطقة، وجود دوالي كبيرة، وأي حالة وعائية غير واضحة أو غير مشخصة — الدوالي الكبيرة مش معناها إن العميل ممنوع نهائيًا، لكن لازم الدكتور يشوف الحالة الأول"]], "products": [], "booking": ["بالنبضة: الحجز حسب عدد الـ Pulses", "جلسة للمنطقة: Under Eye / Lower Leg حتى 400 نبضة / Upper Leg حتى 500 نبضة", "Pulse Package: باكدجات بعدد نبضات حسب المتاح (عدد النبضات الفعلي بيتحدد حسب المنطقة والحالة أثناء الجلسة)", "نفس جهاز إزالة الشعر، لكن بإعدادات مختلفة مخصصة للشعيرات الدموية، وسعر الـ Pulse مختلف عن سعر Pulse إزالة الشعر", "⚠️ الدوالي الكبيرة لازم الدكتور يشوفها الأول قبل تأكيد حجز جلسة الليزر", "السعر موحد في جميع الفروع، بما فيها التجمع"], "care": [["قبل", "تجنب التعرض للشمس أو حدوث Sun Tan لمدة حوالي أسبوعين قبل الجلسة"], ["قبل", "لازم إبلاغ الدكتور لو العميل عنده دوالي كبيرة أو مشكلة وعائية واضحة في المنطقة، ولو الحالة غير واضحة ما يتمش تأكيد جلسة ليزر قبل تقييم الدكتور"], ["بعد", "ممكن يحصل احمرار بسيط أو تغير مؤقت للون المنطقة مكان الشعيرات لعدة أيام"], ["بعد", "تجنب الشمس المباشرة والـ Sauna والمياه شديدة السخونة والرياضة العنيفة لمدة حوالي 48 ساعة، والالتزام باستخدام Sunblock حسب تعليمات الدكتور"]], "say": [["ده نفس ليزر إزالة الشعر؟", "نفس جهاز Cynosure Elite+، لكن بنستخدم إعدادات مختلفة ومخصصة للشعيرات الدموية"], ["عندي دوالي في رجلي، ينفع أعمل الجلسة؟", "لو الدوالي كبيرة، لازم الدكتور يشوفها الأول ويحدد الأنسب للحالة. تحبي أحجزلك كشف عند الدكتور؟"], ["هتختفي من أول جلسة؟", "الشعيرات بتبدأ تخف تدريجيًا خلال الأسابيع بعد الجلسة، وممكن تحتاج الحالة لأكتر من جلسة حسب الاستجابة"], ["هل ممكن أعملها وأنا متعرضة للشمس؟", "لازم نتجنب الـ Sun Tan قبل الجلسة بحوالي أسبوعين، والدكتور يحدد إذا البشرة مناسبة للجلسة"]], "escalate": "حروق واضحة، ظهور فقاقيع، ألم شديد أو بيزيد، أو تورم واضح أو متزايد في الرجل — أي عرض شديد أو غير متوقع بيتحول للدكتور فورًا من غير تطمين العميل", "review": ["عميلة عندها دوالي كبيرة وعايزة تحجز جلسة ليزر، تعمل إيه؟", "إيه الفرق بين إعدادات ليزر الشعيرات وليزر إزالة الشعر؟", "إيه المدة اللي لازم تجنب فيها الشمس قبل الجلسة؟"]}, {"id": "filler_face", "name": "فيلر الوجه (Facial Filler)", "branch": null, "summary": "الفيلر هو مادة مالئة، غالبًا Hyaluronic Acid، بتتحقن تحت الجلد لتعويض الحجم المفقود أو تحديد بعض ملامح الوجه زي الشفايف والخدود وخط الفك والذقن، وكمان لتنعيم بعض الخطوط العميقة. الدكتور بيحدد نوع الفيلر والكمية والمكان المناسب حسب ملامح العميل واحتياجه.", "details": [["دواعي الاستخدام", "زيادة أو استعادة حجم الخدود، تحديد أو تكبير الشفايف بشكل متناسق، تحسين منطقة تحت العين حسب تقييم الدكتور، تحديد خط الفك والذقن، تحسين شكل الأنف في الحالات المناسبة، تنعيم خطوط الابتسامة (Nasolabial Lines) وخطوط الماريونيت (Marionette Lines)، وتعويض فقدان الحجم في بعض مناطق الوجه"], ["الأماكن المتاحة", "Lips, Cheeks, Under Eye, Jawline, Chin, Nose, Nasolabial Lines, Marionette Lines — والمكان المناسب ونوع الفيلر بيحدده الدكتور بعد الكشف"], ["مدة الجلسة", "حوالي 20-45 دقيقة، وممكن يتم استخدام كريم مخدر قبل الحقن، وبعض أنواع الفيلر نفسها فيها مادة مخدرة لتقليل الإحساس"], ["النتيجة", "الشكل بيظهر مباشرة بعد الحقن، وممكن يحصل تورم أو كدمات في البداية فالشكل النهائي محتاج وقت للاستقرار، وبيستقر غالبًا خلال حوالي أسبوعين حسب المنطقة واستجابة الجسم"], ["مدة استمرار النتيجة", "Lips: حوالي 6-12 شهر. Cheeks / Jawline: حوالي 12-18 شهر. Under Eye: حوالي 9-12 شهر أو أكتر. المدة تقديرية وليست ضمانًا، والدكتور يحدد التوقعات حسب الحالة والمنتج"], ["ميزة مهمة", "فيلر الـ Hyaluronic Acid يمكن إذابته باستخدام Hyaluronidase / Hyalase في الحالات اللي يرى فيها الطبيب إن الإذابة مناسبة، وده مش معناه إن كل مشكلة بعد الفيلر لازم تتذاب — القرار للطبيب حسب الحالة"], ["مش مناسب لـ / لازم تتراجع مع الدكتور", "الحمل أو الرضاعة، وجود التهاب أو عدوى نشطة في مكان الحقن، حساسية معروفة من مكونات الفيلر أو مواد التخدير، اضطرابات تخثر الدم غير المنضبطة، بعض أمراض المناعة أو الحالات الطبية الخاصة حسب تقييم الدكتور، ووجود فيلر سابق في نفس المنطقة خصوصًا لو المنتج أو تاريخه غير معروف"]], "products": [["Juvederm (جوفيديرم)", "أمريكا (Allergan)", "Ultra 2/3/4, Volbella للشفايف والخطوط الرفيعة، Volift للخطوط والـ Volume، Voluma للخدود والدقن، Volux للفك والدقن"], ["Teoxane (تيوكسان)", "سويسرا", "RHA 1 خطوط رفيعة، RHA 2/3 خطوط وشفايف، RHA 4 Volume، Kiss للشفايف، Ultra Deep Volume عميق، Redensity I/II جودة البشرة وبعض استخدامات تحت العين"], ["Neauvia (نيوفيا)", "سويسرا", "Intense Lips للشفايف، Intense/Intense Flux/Intense LV خطوط وحجم، Stimulate Volume + تحفيز الكولاجين، Man أنواع مخصصة للاستخدامات الرجالية"], ["Croma (كروما)", "النمسا", "Volume وVolume Plus"], ["Celosome (سيلوسوم)", "كوريا الجنوبية", "Soft خطوط رفيعة، Mid خطوط متوسطة، Strong خطوط عميقة، Implant تحديد وحجم"], ["أنواع كورية أخرى معتمدة", "كوريا الجنوبية", "حسب المنتجات المتاحة، والدكتور هو اللي بيحدد النوع المناسب للحالة"]], "booking": ["السعر للسرنجة الواحدة، وممكن الدكتور يستخدم أكتر من نوع أو أكتر من سرنجة في نفس الجلسة حسب الحالة", "الـ Cannula بتتضاف على الفاتورة بس لو الدكتور استخدمها", "ممنوع حقن أي فيلر العميل جايبه من خارج العيادة، والسرنجة مخصصة لشخص واحد فقط", "المتبقي من السرنجة ممكن يُستخدم في Touch-up لنفس المريض فقط خلال شهر بحد أقصى، حسب سياسة العيادة وتوجيه الدكتور", "الإذابة (Hyalase) مجانية لو الفيلر اتحقن جوه Allure، وبمقابل لو اتحقن برا Allure — لازم إبلاغ الدكتور قبل تأكيد الحجز ويلزم اختبار حساسية حسب بروتوكول العيادة", "⚠️ الـ Agent لا يحدد نوع الفيلر المناسب للعميل من نفسه؛ النوع والكمية قرار الدكتور بعد التقييم، ولا يقرر صلاحية العميل للفيلر"], "care": [["قبل", "يفضل تجنب Aspirin / Omega-3 / Vitamin E قبل الجلسة بحوالي أسبوع إذا وافق الطبيب. أدوية السيولة الموصوفة ما تتوقفش من العميل نفسه، لازم يرجع لطبيبها"], ["قبل", "إبلاغ الدكتور بأي حساسية معروفة (من الفيلر أو مواد التخدير)، وأي تاريخ سابق لحقن فيلر، وتأجيل الحقن عند وجود التهاب أو عدوى نشطة زي الـ Herpes"], ["قبل", "الحمل والرضاعة يتم إبلاغ الدكتور بيهم قبل الحجز"], ["بعد", "تورم أو كدمات بسيطة ممكن تحصل من يومين لأسبوع، والشفايف ممكن يكون فيها تورم أكتر"], ["بعد", "تجنب الرياضة العنيفة 24-48 ساعة، وتجنب الساونا والحرارة العالية والشمس المباشرة حوالي 48 ساعة أو حسب تعليمات الدكتور"], ["بعد", "تجنب المكياج حوالي 12 ساعة، وعدم تدليك أو الضغط على مكان الحقن إلا بتوجيه الطبيب، ويفضل النوم على الظهر أول ليلة"]], "say": [["الفيلر بيوجع؟", "غالبًا الإحساس بسيط، وبنستخدم كريم مخدر، وبعض أنواع الفيلر نفسها فيها مخدر. ممكن تحسي بشكة أو ضغط بسيط أثناء الحقن"], ["هيبان مصطنع؟", "الهدف شكل متناسق وطبيعي مع ملامح الوجه، والدكتور بيحدد الشكل والكمية المناسبة بعد الكشف"], ["لو ماعجبنيش؟", "لو الفيلر Hyaluronic Acid، ممكن يكون قابل للإذابة بمادة خاصة (Hyaluronidase/Hyalase) لو الدكتور قرر إن الإذابة مناسبة"], ["بتستخدموا فيلر إيه؟ وهل هو أصلي؟", "عندنا أنواع وماركات مختلفة متاحة، والدكتور بيحدد الأنسب للحالة، والمنتجات من مصادر معتمدة حسب سياسة العيادة"], ["أنا جايبة الفيلر معايا", "للأسف مش بنقدر نحقن منتجات من خارج العيادة، علشان لازم نضمن مصدر المنتج وطريقة حفظه وسلامته"], ["فاضل في السرنجة، أحتفظ بيه؟", "المتبقي مش بيتحفظ لشخص تاني، ولو مناسب طبيًا ممكن يتعمل بيه Touch-up لنفس المريض بس خلال شهر بحد أقصى حسب سياسة العيادة وتوجيه الدكتور"]], "escalate": "ألم شديد أو بيزيد بشكل واضح، الجلد بيبيض أو بيزرق أو فيه تغير لون/تبقع غير طبيعي، برودة أو تغير واضح في الجلد بالمنطقة، أو أي تغيير في النظر — دي ممكن تكون علامات انسداد وعائي (Vascular Occlusion) ومحتاجة تقييم طبي عاجل", "review": ["اذكر 3 علامات طوارئ بعد الفيلر ممكن تدل على انسداد وعائي", "إمتى إذابة الفيلر بتبقى مجانية وإمتى بتبقى بمقابل؟", "فاضل نص سرنجة، ينفع تتعمل بيها Touch-up لعميل تاني؟", "مين اللي بيحدد نوع وكمية الفيلر — الـ Agent ولا الدكتور؟"]}, {"id": "filler_body", "name": "فيلر الجسم (Body Filler)", "branch": null, "summary": "فيلر مخصص لاستخدامات الجسم، بيتحقن بكميات أكبر من فيلر الوجه بهدف ملء أو تعديل شكل بعض المناطق من غير تدخل جراحي. مش سيليكون ومش مادة دائمة، وبيتم امتصاصه تدريجيًا مع الوقت.", "details": [["دواعي الاستخدام", "تحسين تجاويف جانب الورك (Hip Dips)، تجميل وتعديل شكل المؤخرة، تحسين مظهر ظهر اليد، تصحيح بعض التجاويف أو عدم التناسق بعد عمليات الشفط، وتحسين بعض المناطق اللي محتاجة تعويض حجم حسب تقييم الدكتور"], ["المناطق المتاحة", "Hip Dips, Buttocks, Back of Hands, وبعض التجاويف بعد Liposuction — والمنطقة المناسبة وكمية الفيلر بيحددها الدكتور بعد الكشف"], ["مدة الجلسة", "حوالي 45 دقيقة لساعة ونصف، مع تخدير موضعي حسب الإجراء وتقييم الدكتور"], ["النتيجة", "التغيير في الشكل بيظهر مباشرة بعد الحقن، والتورم ممكن يأثر على الشكل في البداية، والنتيجة بتستقر تدريجيًا خلال حوالي أسبوعين لشهر"], ["مدة استمرار النتيجة", "غالبًا حوالي 12-24 شهر، وبتختلف حسب المنطقة وكمية الفيلر والمنتج واستجابة الجسم (تقديرية وليست ضمانًا)"], ["مش مناسب لـ / لازم تتراجع مع الدكتور", "الحمل أو الرضاعة، وجود التهاب أو عدوى في المنطقة، وجود حقن سابق في نفس المكان بمادة غير معروفة، وجود أي إجراء أو مادة سابقة في المنطقة محتاجة تقييم، وأي حالة طبية أو جلدية غير واضحة"]], "products": [["Skin Fill (سكين فيل)", "—", "Body Filler، متاح بكميات 10 ml أو 50 ml، والدكتور بيحدد الكمية حسب المنطقة والحالة"], ["Variofill (فاريوفيل)", "—", "Body Filler، عبوة 10 ml"], ["Hyacorb (هياكورب)", "—", "Body Filler بدرجتين MLF1 / MLF2، والدكتور بيحدد النوع المناسب حسب المنطقة"]], "booking": ["كمية الـ Filler المطلوبة بتتحدد في الكشف حسب المنطقة والشكل المطلوب، ومفيش تحديد عدد ml للعميل كرقم نهائي قبل الكشف", "الـ Cannula بتتضاف على الفاتورة فقط لو الدكتور استخدمها", "ممنوع حقن أي منتج العميل جايبه من خارج العيادة", "⚠️ الـ Agent ما يحددش للعميل نوع المنتج أو عدد الـ ml المناسب من نفسه؛ ده بيتحدد بعد الكشف"], "care": [["قبل", "اسأل العميل إذا كان عمل حقن سابق في نفس المنطقة، وسجل اسم المادة وتاريخ الحقن لو معروفين. لو المادة السابقة غير معروفة، لازم تبلغ الدكتور قبل تأكيد الإجراء"], ["قبل", "إبلاغ الدكتور بأي التهاب أو مشكلة جلدية في المنطقة، والحمل والرضاعة لازم يتم إبلاغ الدكتور بهم قبل الحجز"], ["بعد", "ممكن يحصل تورم أو زرقان أو إحساس بالشد، وغالبًا يستمر حوالي أسبوع"], ["بعد", "تجنب الرياضة العنيفة حوالي أسبوعين أو حسب تعليمات الدكتور، وممنوع التدليك أو المساج على المنطقة إلا بإذن الدكتور"], ["بعد", "تجنب الساونا والحرارة العالية إلا بعد السماح من الدكتور، والالتزام بتعليمات الدكتور بخصوص القعدة والنوم خلال الأيام الأولى"]], "say": [["ده زي السيليكون؟", "لأ، ده Body Filler، مش سيليكون ولا مادة دائمة، وبيتم امتصاصه تدريجيًا مع الوقت"], ["هحتاج كام ml؟", "الكمية بتتحدد في الكشف حسب المنطقة وحجم التصحيح المطلوب والشكل اللي عايزاه، والدكتور هو اللي بيحدد الكمية المناسبة"], ["أنا عاملة حقن قبل كده في نفس المكان", "مهم جدًا نعرف اسم المادة وتاريخ الحقن لو متاح، ونسجلهم للدكتور علشان يقيّم المنطقة قبل أي إجراء جديد"], ["النتيجة بتظهر إمتى؟", "التغيير بيظهر من البداية، لكن التورم ممكن يأثر على الشكل، والنتيجة بتستقر تدريجيًا خلال حوالي أسبوعين لشهر"], ["الفيلر بيدوم للأبد؟", "لأ، فيلر الجسم مش مادة دائمة، ومدة استمراره بتختلف حسب المنطقة والمنتج والكمية واستجابة الجسم"]], "escalate": "ألم شديد أو بيزيد، سخونية واضحة، احمرار بينتشر، تغير غير طبيعي في لون الجلد، إفرازات من مكان الحقن، أو تورم شديد أو متزايد بشكل غير طبيعي — ما يتطمنش العميل إن ده طبيعي، وتتحول الحالة للدكتور فورًا", "review": ["اذكر منطقتين من المناطق المتاحة لفيلر الجسم", "عميلة عاملة حقن قبل كده في نفس المكان بمادة مش عارفة اسمها، تعمل إيه؟", "فيلر الجسم بيدوم قد إيه في المتوسط؟"]}, {"id": "filler_calcium", "name": "فيلر الكالسيوم (Calcium Fillers)", "branch": null, "summary": "فيلر مادته كالسيوم هيدروكسيل أباتيت (CaHA)، بيدي حجم وتحديد على طول، وكمان بيحفز الكولاجين مع الوقت. أتقل من الفيلر العادي، ومابيدوبش بالـ Hyalase.", "details": [["الاستخدامات", "تحديد الفك والدقن، إبراز الخدود، خطوط الابتسامة العميقة، ظهر الإيد. وبتركيز مخفف لشد الجلد في الرقبة والصدر والجسم"], ["مدة الجلسة", "30-45 دق ة (Gummy Smile)، وMeso Botox حسب تقييم الدكتور"], ["دواعي الاستخدام - فرط التعرق", "تحت الإبط، اليدين، القدمين — واختيار المنطقة والجرعة وعدد الوحدات بيحدده الدكتور"], ["مدة الجلسة", "حوالي 10-20 دقيقة بإبر رفيعة جدًا"], ["النتيجة", "تبدأ تظهر عادةً خلال 3-5 أيام، والنتيجة الكاملة بتبان تقريبًا خلال أسبوعين، والمدة غالبًا 3-6 شهور وبتختلف حسب المنطقة واستجابة الجسم. تأثير علاج فرط التعرق ممكن يستمر لفترة أطول في بعض الحالات"], ["المتابعة والـ Retouch", "بوتوكس الوجه: يمكن عمل Retouch بعد أسبوعين لو احتاج الدكتور، والـ Retouch المجاني حسب سياسة الحجز لبوتوكس الوجه فقط حتى 50 وحدة. مفيش Retouch مجاني للإبط أو اليدين أو القدمين أو Gummy Smile أو Meso Botox أو البوتوكس بالوحدة — لازم توضيح سياسة الـ Retouch للعميل قبل تأكيد الحجز"], ["مش مناسب لـ / بلّغ الدكتور", "الحمل والرضاعة، بعض الأمراض العصبية والعضلية (زي Myasthenia Gravis)، وجود التهاب أو عدوى في مكان الحقن، حساسية معروفة تجاه Botulinum Toxin أو أحد مكونات المنتج، وأي أدوية أو حالات طبية مهمة يتم إبلاغ الدكتور بيها قبل الإجراء"]], "products": [["Botox (Allergan)", "أمريكا", "المنتج الأصلي من Allergan، من منتجات Botulinum Toxin المتاحة"], ["Dysport (Ipsen)", "فرنسا", "من نفس فئة Botulinum Toxin"], ["Metox / Korean Botulinum Toxin", "كوريا الجنوبية", "منتجات Botulinum Toxin كورية معتمدة حسب المتاح"]], "booking": ["الوحدة بـ 90 جنيه، وعدد الوحدات النهائي بيحدده الدكتور حسب المنطقة والحالة", "Botox الوجه حتى 50 وحدة له سعر حسب سياسة الحجز، مع Retouch مجاني بعد أسبوعين حسب الشروط المذكورة، ومفيش Retouch مجاني للمناطق أو الخدمات المستثناة", "Allergan وDysport ضمن فئة سعرية واحدة حسب سياسة الأسعار، والمنتجات الكورية لها فئة سعرية مختلفة", "⚠️ عدد الوحدات النهائي ما بيتأكدش للعميل قبل تقييم الدكتور"], "care": [["قبل", "إبلاغ الدكتور بأي أمراض عصبية أو عضلية، أو حمل أو رضاعة، أو حساسية معروفة، أو أدوية/مكملات قد تؤثر على النزيف أو ظهور الكدمات"], ["قبل", "ممنوع إيقاف أي دواء موصوف، خصوصًا مميعات الدم، من تلقاء نفس العميل؛ الطبيب المعالج هو اللي يحدد. يفضل الحضور بوجه نظيف وخالٍ من المكياج في حالة بوتوكس الوجه"], ["بعد", التليفون؛ نوع الخيط بيتحدد بعد الكشف، وعدد الخيوط بيتحدد حسب المنطقة ودرجة الترهل، والطبيب بيحدد الخطة المناسبة", "الخيوط التجميلية متاحة في كل الفروع"], "care": [["قبل", "يفضل إبلاغ الطبيب بأي أدوية أو مكملات يتناولها العميل، وأي حساسية أو مشاكل صحية مهمة. الطبيب يحدد أي تعليمات إضافية قبل الإجراء حسب الحالة"], ["أول أسبوع", "تجنب فتح الفم بشكل مبالغ فيه، وتجنب تعبيرات الوجه القوية، وتجنب الأكل اللي يحتاج مضغ قوي، وتجنب الساونا والرياضة العنيفة، والالتزام بتعليمات الطبيب"], ["أول أسبوعين", "تجنب تدليك الوجه، وتجنب علاجات الأسنان إلا بعد الرجوع للطبيب"], ["طبيعي يحصل", "تورم بسيط، زرقان أو كدمات، إحساس بالشد، ألم أو عدم راحة بسيطة، وممكن يظهر تكسير أو تموج بسيط في الجلد ويختفي تدريجيًا"], ["النوم", "يفضل النوم على الظهر في الفترة الأولى حسب تعليمات الطبيب"]], "say": [["هحتاج كام خيط؟", "ده بيتحدد في الاستشارة حسب المنطقة ودرجة الترهل ونوع الخيط. سعر الخيط بيبدأ من كذا، والدكتور بيحدد العدد النهائي بعد الكشف"], ["زي شد الوش بالجراحة؟", "لا، الخيوط إجراء غير جراحي، وممكن تكون مناسبة لبعض حالات الترهل البسيط والمتوسط. لو الترهل شديد، الدكتور بيقيّم الحالة ويحدد الخيار الأنسب"], ["الخيوط بتفضل جوه؟", "الخيوط المستخدمة قابلة للتحلل وبتتحلل تدريجيًا حسب نوعها، بينما تأثير تحفيز الكولاجين ممكن يستمر بعد تحلل الخيط"], ["خيوط ولا فيلر؟", "الاتنين مختلفين: الفيلر بيستخدم أساسًا لتعويض أو إضافة حجم وتحديد بعض المناطق، والخيوط هدفها الأساسي شد ورفع بعض الأنسجة وتحفيز الكولاجين. وفي بعض الحالات ممكن الطبيب يجمع بين أكتر من إجراء حسب احتياج الحالة"], ["ممكن أعرف السعر من غير استشارة؟", "نقدر نقول سعر بداية الخيط الواحد، لكن ما نقدرش نحدد العدد أو التكلفة الإجمالية قبل ما الدكتور يشوف الحالة"]], "escalate": "ألم بيزيد بدل ما يقل، سخونية أو احمرار متزايد، إفرازات أو صديد، تورم شديد أو متزايد، طرف خيط ظاهر أو خارج من الجلد، أو تغير واضح وغير معتاد في لون الجلد", "review": ["الخيوط متاحة فين؟", "السعر بيتحسب إزاي؟ ومين بيحدد النوع والعدد؟", "أقدر أقول للعميل التكلفة النهائية على التليفون؟", "عميل عنده ترهل شديد جدًا وعايز خيوط، تعمل إيه؟"]}, {"id": "hifu", "name": "الهايفو (HIFU)", "branch": "متاح في فرع طنطا ٢ - سعيد فقط، والجهاز لا ينتقل بين الفروع", "summary": "الهايفو بيستخدم موجات فوق صوتية مركزة بتوصل لطبقات عميقة تحت الجلد، وبتحفز إنتاج الكولاجين، وده بيساعد على شد وتحسين مظهر ترهل البشرة من غير جراحة أو حقن.", "details": [["المناطق", "الوجه، الوجه والرقبة، الرقبة، الدبل تشين، والبطن"], ["عدد الجلسات", "غالبًا جلسة واحدة، وممكن الدكتور يوصي بجلسة إضافية حسب الحالة والاستجابة. جلسات المتابعة أو الصيانة بيحددها الدكتور حسب الحالة. ما نحددش للعميل من البداية إنه محتاج عدد جلسات معين"], ["مدة الجلسة", "من 30 لـ 90 دقيقة تقريبًا، حسب المنطقة وعدد الخطوط المستخدمة"], ["الإحساس أثناء الجلسة", "وخز بسيط أو متوسط، إحساس بالحرارة أو الطاقة في عمق الجلد، ودرجة الإحساس بتختلف من شخص للتاني"], ["النتيجة", "ممكن يظهر شد بسيط بعد الجلسة، والتحسن الأساسي بيظهر بشكل تدريجي خلال حوالي 2-3 شهور، وممكن تستمر النتيجة حوالي سنة أو أكتر حسب الحالة — ممنوع نقول إن النتيجة مضمونة لمدة محددة"], ["عدد الخطوط والتسعير", "كل منطقة ليها حد أقصى من الخطوط ضمن السعر الأساسي: الوجه 100 خط، الوجه والرقبة 150 خط، الرقبة 75 خط، الدبل تشين 50 خط، البطن 500 خط"], ["خطوط إضافية", "Face Tip: الخط الإضافي = 25 جنيه. Body Tip: كل 100 خط إضافي = 750 جنيه. الزيادة ما بيحددهاش الـ Agent؛ الدكتور هو اللي بيحدد إذا كانت الحالة محتاجة خطوط إضافية"], ["مش مناسب لـ / لازم نبلغ الدكتور", "الحمل، وجود Pacemaker أو جهاز إلكتروني مزروع، وجود معادن أو زرعات في منطقة العلاج، وجود جروح أو التهاب نشط أو حبوب نشطة بالمنطقة، ووجود فيلر حديث في نفس المنطقة"]], "products": [], "booking": ["متاح في طنطا شارع السعيد فقط، والجهاز لا ينتقل لأي فرع آخر — لازم العميل يعرف مكان الخدمة قبل تأكيد الحجز", "كل منطقة ليها أقصى عدد خطوط ضمن السعر الأساسي (شوف تفاصيل الخطوط في details)", "الخطوط الإضافية: Face Tip 25 جنيه للخط، Body Tip 750 جنيه لكل 100 خط، وبيحددها الدكتور أثناء الجلسة", "⚠️ في الحالات اللي محتاجة تقييم طبي (Pacemaker، معادن مزروعة، فيلر حديث، التهاب) ما نديش موافقة من نفسنا؛ يتم الرجوع للدكتور"], "care": [["قبل", "اسأل العميل: هل يوجد Pacemaker أو جهاز إلكتروني مزروع؟ هل يوجد أي معدن أو زرعة في منطقة العلاج؟ هل تم عمل فيلر حديث في نفس المنطقة؟ هل يوجد التهاب أو جروح أو حبوب نشطة في المنطقة؟"], ["قبل", "لو فيه أي نقطة غير واضحة، تحويل للدكتور قبل تأكيد الخدمة"], ["بعد", "ممكن يحصل احمرار بسيط، تورم خفيف، ألم بسيط عند اللمس، أو تنميل بسيط لفترة مؤقتة، وغالبًا يقدر العميل يمارس نشاطه اليومي بشكل طبيعي حسب تقييم الدكتور"]], "say": [["الهايفو بيعمل إيه؟", "بيستخدم موجات فوق صوتية مركزة بتوصل لطبقات عميقة تحت الجلد وبتحفز الكولاجين، وده بيساعد على شد وتحسين مظهر البشرة من غير جراحة أو حقن"], ["متاح في فرعي؟", "الهايفو متاح حاليًا في فرع طنطا شارع السعيد فقط، والجهاز مابيتنقلش بين الفروع"], ["هشوف النتيجة إمتى؟", "ممكن تلاحظي شد بسيط بعد الجلسة، لكن التحسن الأساسي بيظهر تدريجيًا خلال حوالي شهرين لـ 3 شهور"], ["ليه السعر ممكن يزيد؟", "كل منطقة ليها عدد خطوط محدد داخل السعر، ولو الدكتور شاف إن الحالة محتاجة خطوط إضافية، الزيادة بتتحسب حسب عدد الخطوط المستخدمة"], ["لو احتجت خطوط زيادة بكام؟", "في الـ Face Tip الخط الإضافي بـ 25 جنيه، وفي الـ Body Tip كل 100 خط إضافي بـ 750 جنيه"], ["الهايفو ولا الخيوط؟", "كل إجراء له استخدام وطريقة مختلفة، والأنسب بيتحدد حسب درجة الترهل والحالة، والدكتور يقدر يحددلك الاختيار المناسب بعد التقييم"], ["ممكن أعمله في التجمع؟", "الهايفو متاح حاليًا في طنطا شارع السعيد فقط، والجهاز غير متاح في التجمع"]], "escalate": "حرق أو فقاقيع، علامات أو تغير واضح وغير معتاد في الجلد، تنميل مستمر أو متزايد، ضعف في حركة عضلات الوجه، أو ألم شديد أو متزايد بشكل غير معتاد", "review": ["الهايفو متاح فين؟ وليه الجهاز ما بينتقلش؟", "إيه اللي لازم تسأل عنه قبل جلسة الهايفو؟", "عميل احتاج خطوط زيادة في جلسة وجه، ازاي بيتحسب السعر؟"]}, {"id": "dermapen", "name": "الديرمابن (Dermapen 4 والعادي)", "branch": null, "summary": "جهاز Microneedling بيعمل فتحات دقيقة جدًا في الجلد بعمق محسوب، وده بيساعد البشرة على التجدد وتحفيز الكولاجين. بيُستخدم مع مواد إضافية حسب البروتوكول زي PRP والميزوثيرابي والإكزوزومز والـ PDRN وسيرومات مخصصة.", "details": [["الاستخدامات", "آثار الحبوب، المسام الواسعة، الخطوط الرفيعة، بهتان البشرة، التصبغات الخفيفة، وStretch Marks/الشقوق — النتيجة وعدد الجلسات بيختلفوا حسب الحالة ونوع المشكلة"], ["بيتعمل مع إيه", "الديرمابن عندنا بيتم مع مادة إضافية زي PRP أو الميزوثيرابي أو الإكزوزومز أو PDRN أو سيرومات مخصصة حسب البروتوكول، والمادة المناسبة بيحددها الدكتور"], ["أنواع الديرمابن", "Dermapen 4: أحدث من العادي، بيستخدم Needle مخصص سعره 2200 جنيه. Derma Pen العادي: بـ 12 أو 36 إبرة، سعر الـ Needle 150 جنيه (نفس السعر للاتنين). الدكتور هو اللي بيحدد النوع والـ Needle المناسب"], ["عدد الجلسات", "غالبًا من 3-6 جلسات، بفاصل حوالي 4-6 أسابيع، والعدد النهائي بيتحدد حسب حالة البشرة والمشكلة واستجابتها والمادة المستخدمة"], ["مدة الجلسة", "حوالي 45 دقيقة لساعة، شاملة وقت الكريم المخدر"], ["فترة التعافي", "احمرار يشبه لسعة الشمس من يوم لـ 3 أيام، جفاف بسيط، وقشور خفيفة، وبتختلف حسب عمق الجلسة وحالة البشرة"], ["مش مناسب لـ / لازم نبلغ الدكتور", "حب الشباب الملتهب والنشط، الهربس النشط، الإكزيما أو الالتهاب النشط في المنطقة، وجود ميل لتكوين Keloids، والحمل — وفي حالة حب شباب نشط ما نحددش من نفسنا إن VIVACE هو البديل المناسب، بيتم الرجوع للدكتور"]], "products": [], "booking": ["استخدام جهاز الديرمابن نفسه مجاني طالما العميلة عندها الـ Needle الخاصة بيها وبتستخدمها للجلسة", "أول جلسة: الفاتورة = سعر الـ Needle + سعر المادة المستخدمة", "الجلسات التالية: العميلة لا تدفع سعر الـ Needle مرة أخرى، وتدفع سعر المادة المستخدمة فقط", "Dermapen 4 Needle = 2200 جنيه (أول مرة). Derma Pen العادي 12 أو 36 Needle = 150 جنيه (أول مرة)", "⚠️ الـ Needle مخصصة للعميلة نفسها ولا يتم مشاركتها مع عميلة أخرى"], "care": [["قبل", "لو دي مش أول جلسة، فكّر العميلة تجيب الـ Needle الخاصة بيها، واسأل عن وجود التهاب أو حب شباب نشط أو هربس في المنطقة"], ["قبل", "لو فيه حالة طبية أو دواء مش واضح تأثيره على الإجراء، يتم الرجوع للدكتور"], ["بعد", "عدم وضع المكياج 24 ساعة، وتجنب Retinol والأحماض والمقشرات 3-5 أيام حسب تعليمات الدكتور"], ["بعد", "تجنب الساونا والسباحة 48 ساعة، واستخدام مرطب لطيف وSunscreen، وعدم فرك أو تقشير البشرة بعنف"]], "say": [["الديرمابن بكام؟", "الجهاز نفسه مجاني، وبتدفعي تمن الـ Needle أول مرة بس، والـ Needle بتفضل معاكي وتجيبيها في كل جلسة، وبعد كده بتدفعي سعر المادة اللي الدكتور هيختارها للجلسة"], ["سعر الـ Needle كام؟", "لو Dermapen 4 سعر الـ Needle 2200 جنيه، ولو الديرمابن العادي سعر الـ Needle 150 جنيه، سواء 12 إبرة أو 36 إبرة"], ["أنا عملت جلسة قبل كده، هدفع الـ Needle تاني؟", "لا، لو معاكي الـ Needle الخاصة بيكي، بتجيبيها معاكي في كل جلسة ومش بتدفعي تمنها مرة تانية"], ["نسيت الـ Needle بتاعتي", "الـ Needle بتكون مخصصة ليكي، ولو مش معاكي وقت الجلسة ممكن تحتاجي Needle جديدة، وبيتم حساب سعرها"], ["الديرمابن بيتعمل لوحده؟", "الديرمابن عندنا بيتم مع مادة إضافية حسب البروتوكول، زي الميزوثيرابي أو الإكزوزومز أو PDRN أو غيرها، والدكتور بيحدد المادة المناسبة"], ["هو زي الديرمارولر؟", "الاتنين بيشتغلوا بتقنية الـ Microneedling، لكن الديرمابن جهاز بإبر دقيقة وبيسمح بالتحكم في العمق حسب المنطقة والبروتوكول"]], "escalate": "احمرار شديد أو متزايد، سخونية واضحة في المنطقة، ألم شديد أو متزايد، إفرازات أو صديد، تورم شديد، أو ظهور حبوب أو التهاب بشكل واضح بعد الجلسة بأيام", "review": ["الفاتورة في جلسة الديرمابن بتتكون من إيه؟", "مين صاحب النيدل، ويتعمل بيه إيه بعد الجلسة؟", "لو العميلة نسيت الـ Needle بتاعتها، تعمل إيه؟"]}, {"id": "vivace", "name": "الفيفاتشي VIVACE", "branch": "متاح في فرع القاهرة الجديدة فقط", "summary": "جهاز Microneedling + RF، بيستخدم إبر دقيقة جدًا مع طاقة Radiofrequency بشكل محكوم داخل الجلد، وده بيساعد على تحفيز الكولاجين وتحسين شد وملمس البشرة.", "details": [["الاستخدامات", "ترهل وارتخاء البشرة، تحسين مظهر المسام، آثار حب الشباب، الخطوط الرفيعة، تحسين تحديد الفك، الرقبة، منطقة الـ Décolleté، وبعض حالات حب الشباب النشط باستخدام الـ TIP المخصص حسب تقييم الطبيب"], ["عدد الجلسات", "غالبًا 3 جلسات بفاصل حوالي 4-6 أسابيع، وبعدها ممكن جلسات صيانة حسب حالة البشرة وتقييم الطبيب"], ["مدة الجلسة", "حوالي ساعة، منها حوالي 30 دقيقة لكريم التخدير"], ["فترة التعافي", "احمرار أو تورم خفيف من 1-3 أيام، وممكن تظهر نقط صغيرة مكان الإبر، وبتختلف حسب شدة الجلسة واستجابة البشرة"], ["النتيجة", "ممكن تظهر نضارة وتحسن أولي خلال فترة قصيرة، وتحسن الملمس والشد بيظهر تدريجيًا مع تحفيز الكولاجين وقد يستمر يتحسن خلال الأسابيع والشهور التالية"], ["الـ TIP", "مخصص لكل مريضة، سعره 2000 جنيه، بتشتريه مرة واحدة وتجيبه معاها في كل جلسة لاحقة. لو معاها الـ TIP الخاص بيها، مش بتدفع تمن TIP جديد"], ["مش مناسب لـ / بلّغ الدكتور", "الحمل، وجود Pacemaker أو جهاز إلكتروني مزروع، وجود معادن أو أجهزة مزروعة في منطقة العلاج، التهاب أو عدوى جلدية نشطة (باستثناء حالات ممكن التعامل معها بالـ TIP المخصص بعد تقييم الطبيب)، الميل الشديد لتكوين Keloid، وأي حالة جلدية نشطة أو غير واضحة"]], "products": [], "booking": ["جلسة واحدة + المريضة معها الـ TIP = 2000 جنيه", "3 جلسات + المريضة معها الـ TIP = 4000 جنيه", "أول جلسة بدون TIP سابق = 4000 جنيه (شامل الـ TIP)", "باكدج 3 جلسات + TIP جديد = 5500 جنيه", "لو العميلة هتعمل VIVACE مع Exosomes أو Mesotherapy أو PRP، يتم إضافة سعر المادة/الخدمة الإضافية حسب مكتب الأسعار", "متاح في فرع التجمع الخامس فقط، لازم العميل يعرف ده قبل الحجز"], "care": [["قبل", "اسأل العميلة عن وجود Pacemaker أو أي جهاز إلكتروني مزروع، وعن وجود معادن أو أجهزة مزروعة في منطقة العلاج وسجل المعلومة"], ["قبل", "إبلاغ الطبيب بأي أدوية أو علاجات جلدية حالية، وأي التهاب أو مشكلة جلدية موجودة في منطقة العلاج"], ["بعد", "تجنب المكياج 24 ساعة أو حسب تعليمات الطبيب، وتجنب الـ Retinol والأحماض والمقشرات القوية 3-5 أيام"], ["بعد", "تجنب الساونا والرياضة العنيفة حوالي 48 ساعة، والالتزام بواقي الشمس، وعدم فرك أو حك الجلد"]], "say": [["متاح في فرعي؟", "الـ VIVACE متاح في فرع التجمع الخامس فقط، تحبي أحجزلك هناك؟"], ["ليه أول جلسة أغلى؟", "لأن أول مرة بيتم شراء الـ TIP الخاص بيكي، وسعره 2000 جنيه وبيفضل معاكي وتجيبيه في الجلسات التالية"], ["عندي حبوب دلوقتي، ينفع؟", "الجهاز عنده TIP مخصص للحالات اللي فيها حب شباب نشط، لكن الدكتور بيحدد إذا كان مناسب لحالتك ونوع الجلسة بعد تقييم البشرة"], ["إيه الفرق بينه وبين الديرمابن؟", "الاتنين بيعتمدوا على Microneedling، لكن الـ VIVACE بيضيف Radiofrequency (RF) داخل الجلد، وده بيضيف تحفيز حراري للكولاجين بجانب تأثير الإبر"]], "escalate": "حرق واضح أو فقاقيع، ألم شديد أو بيزيد، سخونية شديدة في المنطقة، صديد أو إفرازات، احمرار شديد أو متزايد ومستمر، أو تورم شديد أو غير معتاد", "review": ["الـ VIVACE متاح فين؟ والتيب بتاع مين؟", "إيه السؤال اللي لازم تسأله قبل الجلسة بخصوص القلب؟", "عميلة معاها TIP خاص بيها، هتدفع تمنه تاني في الجلسة التالية؟"]}, {"id": "cleansing", "name": "جلسات تنظيف البشرة (Facial Cleansing)", "branch": "الأجهزة مش متاحة في كل الفروع — OxyGeneo في شبين وطنطا ٢ - سعيد بس، وSkin Cleansing (تنظيف بشرة عادي) في طنطا ١ - الاستاد بس", "summary": "جلسات بتساعد على إزالة الدهون الزائدة والشوائب والرؤوس السوداء والبيضاء والجلد الميت، مع ترطيب البشرة وتحسين شكلها ونضارتها. مناسبة لمعظم أنواع البشرة، لكن لو فيه التهاب شديد أو مشكلة جلدية نشطة، الأفضل تقييم الحالة عند دكتور جلدية الأول.", "details": [["الأنواع المتاحة", "Steam Facial (تنظيف بالبخار)، Facial (تنظيف بشرة تقليدي)، HydraFacial (تنظيف وتقشير وشفط شوائب مع سيرومات ترطيب)، OxyGeneo (تقشير خفيف وتنظيف مع سيرومات ومنتجات مخصصة)، وAqua Pure (تنظيف وترطيب بالجهاز)"], ["خطوات الجلسة", "حسب النوع: تنظيف البشرة، تقشير خفيف، بخار حسب نوع الجلسة، تنظيف الرؤوس والشوائب، سيرومات، ماسك، ومرطب وواقي شمس"], ["مدة الجلسة", "من 45 دقيقة لساعة وربع تقريبًا، حسب نوع الجلسة"], ["التكرار", "غالبًا كل 3-4 أسابيع، حسب نوع البشرة واحتياجها وتعليمات المختص"], ["مش مناسب لـ / يحتاج تقييم الأول", "حب الشباب الملتهب بشدة، التهاب أو عدوى جلدية نشطة، جروح أو تهيج شديد في البشرة، حروق الشمس، وأي حالة جلدية نشطة تحتاج تقييم طبي"], ["توفر الأنواع بالفرع", "OxyGeneo: متاح في شبين وطنطا ٢ - سعيد فقط. Skin Cleansing (تنظيف عادي): متاح في طنطا ١ - الاستاد فقط. لازم تتأكد من توفر النوع المطلوب في فرع العميل قبل تأكيد الحجز"]], "products": [], "booking": ["⚠️ OxyGeneo متاح في شبين وطنطا ٢ - سعيد بس، وSkin Cleansing (التنظيف العادي) متاح في طنطا ١ - الاستاد بس — تأكد من الفرع قبل الحجز", "الأجهزة مش موجودة في كل الفروع؛ لازم تتأكد من توفر الجهاز في فرع العميل قبل تأكيد الحجز", "HydraFacial وOxyGeneo وAqua Pure: السعر حسب مكتب الأسعار والسياسة الحالية", "OxyGeneo: أول جلسة بكبسولة جديدة، والجلسة التالية حسب السياسة الحالية بدون كبسولة جديدة وبسعر أقل"], "care": [["قبل", "يفضل الحضور بدون مكياج، وإبلاغ المختص بأي حساسية أو تهيج أو علاج جلدي حالي"], ["قبل", "لو فيه حب شباب ملتهب جدًا أو التهاب واضح، يفضل كشف جلدية قبل جلسة التنظيف"], ["بعد", "ممكن يحصل احمرار خفيف أو حساسية بسيطة لفترة قصيرة، ويفضل تجنب المكياج الثقيل باقي اليوم لو البشرة متهيجة"], ["بعد", "تجنب الـ Scrubs والمقشرات القوية حوالي 48 ساعة أو حسب تعليمات المختص، واستخدام واقي الشمس"], ["بعد", "لو البشرة محتاجة متابعة، ممكن اقتراح الجلسة التالية بعد حوالي 3-4 أسابيع"]], "say": [["إيه الفرق بين التنظيف العادي والهيدرافيشيال؟", "الهيدرافيشيال بيستخدم جهاز لتنظيف وتقشير البشرة وشفط الشوائب مع الترطيب والسيرومات، أما التنظيف العادي فبيعتمد على خطوات تنظيف تقليدية. اختيار الأنسب بيختلف حسب حالة البشرة"], ["إيه الفرق بين الهيدرافيشيال والأكسجينيو؟", "الاتنين جلسات أجهزة، لكن كل جهاز له طريقة مختلفة في التنظيف والتقشير والسيرومات المستخدمة، والمختص يقدر يرشح الأنسب حسب احتياج بشرتك"], ["عندي فرح بكرة، أعمل تنظيف؟", "الأفضل تعملي الجلسة قبل المناسبة بعدة أيام، لأن أي جلسة تنظيف ممكن تسبب احمرار أو حساسية مؤقتة حسب البشرة، ولو المناسبة قريبة جدًا الأفضل اختيار الجلسة المناسبة بعد تقييم البشرة"], ["أعملها كل قد إيه؟", "غالبًا كل 3-4 أسابيع، لكن المدة المناسبة بتختلف حسب نوع بشرتك واحتياجها"]], "escalate": "التهاب شديد أو متزايد، تورم واضح، ألم شديد، فقاقيع أو حروق، إفرازات أو صديد، أو تهيج شديد ومستمر بعد الجلسة. ولو فيه تورم في الوجه أو الشفايف مع صعوبة في التنفس → توجيه للطوارئ فورًا", "review": ["قبل ما تأكد حجز هيدرافيشيال، لازم تعمل إيه؟", "ليه جلسة الأكسجينيو التانية أرخص؟", "عميلة عندها فرح بكرة وعايزة تعمل تنظيف بشرة، ترد تقول إيه؟"]}, {"id": "peeling", "name": "التقشير (البارد والكيميائي وحب الشباب) - Chemical Peels", "branch": null, "summary": "جلسات تقشير بتستخدم مواد بتركيزات طبية للمساعدة في تجديد سطح البشرة وتحسين الملمس واللون، وتقليل بعض التصبغات وآثار حب الشباب السطحية. نوع التقشير بيتحدد حسب المشكلة ونوع البشرة، فيه أنواع ألطف زي بعض أنواع التقشير البارد، وأنواع كيميائية أقوى ممكن يصاحبها احمرار أو تقشير لعدة أيام.", "details": [["السعر", "الأسعار تبدأ من 500 جنيه، والتكلفة النهائية بتتحدد حسب نوع التقشير والدكتور والكشف"], ["دواعي الاستخدام", "تحسين ملمس البشرة وتوحيد لونها، المساعدة في تحسين آثار حب الشباب السطحية وتقليل التصبغات والبقع السطحية، الكلف والتصبغات حسب تقييم الطبيب، بعض المناطق الداكنة (الإبط، البكيني، الكوع، الركبة)، والبشرة الباهتة وغير المتجانسة"], ["عدد الجلسات", "غالبًا من 3-6 جلسات بفاصل حوالي 2-4 أسابيع، لكن البروتوكول النهائي بيحدده الدكتور حسب الحالة ونوع التقشير"], ["مدة الجلسة", "حوالي 30-45 دقيقة حسب النوع والمنطقة"], ["الأنواع المتاحة", "تقشير بالمنطقة: Green Peel Medium، RaiMelan، Nanopeel، Normelan. تقشير حب الشباب: Acne Mask/Medium/Forte. تقشير بالبف: Normelan، Retipeel. وكمان Cemazone، وChemical Peels: TCA وSA حسب تقييم الطبيب"], ["مش مناسب لـ / بلّغ الدكتور", "الحمل والرضاعة، هربس نشط، جروح أو التهاب أو عدوى جلدية نشطة، حروق شمس أو تعرض قوي للشمس مؤخرًا، حساسية معروفة من مكونات المنتج، استخدام Accutane/Isotretinoin حاليًا أو مؤخرًا، وأي تقشير أو إجراء جلدي حديث في نفس المنطقة"]], "products": [], "booking": ["الأسعار تبدأ من 500 جنيه، والتكلفة النهائية بتتحدد حسب نوع التقشير والدكتور والكشف", "Green Peel وNanopeel وNormelan وRaiMelan: نفس السعر لأي منطقة حسب سياسة الأسعار الحالية", "SA وTCA: سعر حسب سياسة الفرع، سواء للمنطقة الكاملة أو للبقع", "النوع والتركيز النهائي بيحدده الدكتور، وممنوع نحدد للعميل نوع أو تركيز من نفسنا", "التقشير الكيميائي، خصوصًا الأنواع الأقوى، ممكن يسبب احمرار وتقشير لعدة أيام؛ لازم العميل يعرف ده قبل الحجز"], "care": [["قبل", "تجنب التعرض المباشر للشمس قدر الإمكان قبل الجلسة، وإبلاغ الدكتور عن استخدام الريتينول أو المقشرات أو أي منتجات نشطة"], ["قبل", "إبلاغ الدكتور بأي تقشير سابق أو حساسية جلدية، وفي حالة استخدام Accutane/Isotretinoin حاليًا أو مؤخرًا، أو الحمل أو الرضاعة، أو هربس نشط أو أي التهاب/عدوى جلدية"], ["بعد التقشير البارد", "ممكن يحصل احمرار خفيف أو إحساس بالشد حسب النوع، وغالبًا مفيش فترة تعافي كبيرة لكن الاستجابة بتختلف من بشرة للتانية"], ["بعد التقشير الكيميائي", "ممكن يحصل احمرار أو تقشير لعدة أيام حسب النوع والتركيز، ممنوع إزالة الجلد المتقشر باليد، واستخدام المرطب وال  الرأس، قد يستخدمها الطبيب ضمن خطة علاج التساقط الوراثي في الحالات المناسبة. الدكتور بيحدد المناسبة والجرعة والكمية وعدد الجلسات"], ["مش مناسب لـ / يحتاج تقييم دكتور", "الحمل أو الرضاعة، وجود التهاب أو عدوى نشطة في المنطقة، وجود أمراض أو أدوية مستمرة قد تؤثر على الإجراء. بالنسبة لـ Dutasteride: الحمل أو التخطيط للحمل لازم يتبلغ به الطبيب قبل العلاج"]], "products": [], "booking": ["⚠️ الخدمات دي بتتحدد بعد الكشف؛ ما نحجزش الإجراء بشكل مؤكد من غير ما الدكتور يشوف الحالة", "بالنسبة لـ Dutasteride: لازم العميل يذكر للطبيب أي حمل أو تخطيط للحمل، والطبيب هو اللي يحدد المناسبة والجرعة وخطة العلاج، وما نديش للعميل جرعة أو مدة علاج من نفسنا"], "care": [["قبل", "التأكد من وجود كشف وتقييم طبي، وتسجيل أي معلومات مهمة يذكرها العميل وإبلاغ الطبيب. بالنسبة لـ Dutasteride، التأكد من إبلاغ الطبيب بأي حمل أو تخطيط للحمل"], ["بعد تطعيم السنط أو Subcision", "ممكن يحصل احمرار بسيط أو تورم أو زرقان في مكان الإجراء، ويلتزم العميل بتعليمات الطبيب للعناية بالمنطقة"], ["بعد Dutasteride", "يلتزم العميل بتعليمات الطبيب بخصوص غسل الشعر والعناية بفروة الرأس، وما نديش تعليمات إضافية غير معتمدة من الطبيب"]], "say": [["عندي سنط، بتشيلوه إزاي؟", "فيه أكتر من طريقة لعلاج السنط، ومنها التطعيم، لكن الدكتور لازم يشوف الحالة الأول ويحدد الطريقة الأنسب"], ["الندبة غايرة، فيه حل؟", "ممكن يكون Subcision (تسليك الندبات) مناسب لبعض أنواع الندبات الغائرة، وممكن يتعمل مع إجراءات تانية حسب الحالة، والدكتور بيحدد ده بعد الكشف"], ["سمعت عن حقن للشعر اسمها Dutasteride", "موجودة كخيار علاجي لبعض حالات التساقط الوراثي، لكن لازم كشف الأول لأن مش كل الحالات مناسبة لها"], ["ممكن أعمل Dutasteride وأنا بخطط للحمل؟", "لازم تبلغي الدكتور بالتخطيط للحمل قبل أي إجراء، والطبيب هو اللي يحدد إذا كان العلاج مناسبًا أم لا"]], "escalate": "سخونية في مكان الحقن، صديد أو إفرازات، احمرار بيزيد أو بينتشر، ألم شديد أو متزايد، تورم شديد أو غير معتاد، أو أي أعراض غير طبيعية أو متزايدة", "review": ["هل الخدمة محتاجة كشف؟", "هل أقدر أأكد الإجراء قبل تقييم الدكتور؟", "هل Dutasteride يحتاج مراجعة خاصة للحمل أو التخطيط للحمل؟", "هل كل ندبة منا function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function formatScheduleValue(raw, forEdit){
  const lines = String(raw).split("\n").map(s=>s.trim()).filter(Boolean);
  if(lines.length===0) return forEdit ? "" : "–";
  if(lines.length===1) return escapeHtml(lines[0]);
  return lines.map(l=>`(${escapeHtml(l)})`).join("<br>");
}

/* ---------------- الساعة والتاريخ ---------------- */
function updateClock(){
  const el = document.getElementById("headerClock");
  if(!el) return;
  const now = new Date();
  let dateStr, timeStr;
  try{
    dateStr = now.toLocaleDateString('ar-EG-u-ca-gregory', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Africa/Cairo'});
    timeStr = now.toLocaleTimeString('ar-EG-u-ca-gregory', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true, timeZone:'Africa/Cairo'});
  }catch(e){
    dateStr = now.toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true});
  }
  el.innerHTML = `<span class="clock-box"><span class="clock-date">${escapeHtml(dateStr)}</span><span class="clock-time">${escapeHtml(timeStr)}</span></span>`;
}
updateClock();
setInterval(updateClock, 1000);

/* ---------------- التنقل بين الأسابيع لجدول الدكاترة ---------------- */
let weekOffset = 0;
function getWeekStart(offset){
  const now = new Date();
  const day = now.getDay(); // 0=Sun...6=Sat
  const diffToSat = (day + 1) % 7;
  const sat = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  sat.setDate(sat.getDate() - diffToSat + offset*7);
  return sat;
}
function weekKeyStr(satDate){
  const y = satDate.getFullYear();
  const m = String(satDate.getMonth()+1).padStart(2,"0");
  const d = String(satDate.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function formatWeekRange(satDate){
  const end = new Date(satDate);
  end.setDate(satDate.getDate()+6);
  const fmt = d => d.toLocaleDateString('ar-EG', {day:'numeric', month:'long'});
  return `${fmt(satDate)} – ${fmt(end)}`;
}
function dayDateStr(satDate, dayIdx){
  const d = new Date(satDate);
  d.setDate(satDate.getDate()+dayIdx);
  return `${d.getDate()}/${d.getMonth()+1}`;
}
/* انديكس اليوم الحالي في ترتيب DAYS (السبت=0 ... الجمعة=6) */
function todayDayIdx(){ return (new Date().getDay()+1)%7; }
function getEffectiveDayValue(branch, doctorIdx, day, weekKey){
  const wo = branch.weekOverrides && branch.weekOverrides[weekKey];
  if(wo && wo[doctorIdx] && wo[doctorIdx][day] !== undefined) return wo[doctorIdx][day];
  const d = branch.doctors[doctorIdx];
  return (d.week||{})[day] || "";
}
function isDayOverridden(branch, doctorIdx, day, weekKey){
  const wo = branch.weekOverrides && branch.weekOverrides[weekKey];
  return !!(wo && wo[doctorIdx] && wo[doctorIdx][day] !== undefined);
}


function buildTabs(){
  tabsEl.innerHTML = "";
  Object.keys(BRANCH_LABELS).forEach(key=>{
    const btn = document.createElement("button");
    btn.className = "branch-tab";
    btn.textContent = BRANCH_LABELS[key];
    btn.setAttribute("aria-selected", key===currentBranch ? "true":"false");
    btn.addEventListener("click", ()=>{ currentBranch = key; render(); });
    tabsEl.appendChild(btn);
  });
}

document.querySelectorAll("#viewSwitch .view-btn").forEach(btn=>{
  btn.setAttribute("aria-selected", btn.dataset.view===currentView ? "true":"false");
  btn.addEventListener("click", ()=>{
    currentView = btn.dataset.view;
    document.querySelectorAll("#viewSwitch .view-btn").forEach(b=>b.setAttribute("aria-selected", b.dataset.view===currentView?"true":"false"));
    render();
  });
});

const DOCTORS_REV = "2026-09-24";

function buildSnapshot(){
  const branches = {};
  Object.keys(DATA).forEach(k=>{
    if(!DATA[k]) return;
    const { priceCategories, ...rest } = DATA[k];
    branches[k] = rest;
  });
  return {
    shared: SHARED_PRICE_CATEGORIES,
    newcairoLaser: NEWCAIRO_LASER_CATEGORY.items,
    newcairoSkinBoosters: NEWCAIRO_SKINBOOSTERS_CATEGORY.items,
    branches: branches,
    doctorsRev: DOCTORS_REV,
  };
}

function applySnapshot(snap){
  if(!snap) return;
  try{
    if(Array.isArray(snap.shared)){
      SHARED_PRICE_CATEGORIES.length = 0;
      snap.shared.forEach(c=>SHARED_PRICE_CATEGORIES.push(c));
    }
    if(Array.isArray(snap.newcairoLaser)){
      NEWCAIRO_LASER_CATEGORY.items.length = 0;
      snap.newcairoLaser.forEach(it=>NEWCAIRO_LASER_CATEGORY.items.push(it));
    }
    if(Array.isArray(snap.newcairoSkinBoosters)){
      NEWCAIRO_SKINBOOSTERS_CATEGORY.items.length = 0;
      snap.newcairoSkinBoosters.forEach(it=>NEWCAIRO_SKINBOOSTERS_CATEGORY.items.push(it));
    }
    if(snap.branches){
      Object.keys(snap.branches).forEach(k=>{
        if(DATA[k] && snap.branches[k]){
          const b = Object.assign({}, snap.branches[k]);
          if(snap.doctorsRev !== DOCTORS_REV){ delete b.doctors; delete b.weekOverrides; }
          Object.assign(DATA[k], b);
        }
      });
    }
  }catch(e){ console.error("applySnapshot failed", e); }
}

async function initCloudSync(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    if(!db) return;
    dbRef = db.doc("guide/content");
    const snap = await dbRef.get();
    if(snap && snap.exists){
      applySnapshot(snap.data());
      render();
    }
  }catch(e){ /* لا يوجد اتصال بالتخزين السحابي — الصفحة تشتغل عادي بدون مزامنة */ }
}

async function saveToCloud(){
  if(!dbRef){
    editStatus.textContent = "التخزين السحابي مش متاح دلوقتي — التعديل هيفضل في الصفحة دي بس.";
    return;
  }
  editStatus.textContent = "بيتم الحفظ...";
  try{
    await dbRef.set(buildSnapshot());
    editStatus.textContent = "✓ اتحفظ للجميع.";
    setTimeout(()=>{ if(editStatus.textContent==="✓ اتحفظ للجميع.") editStatus.textContent=""; }, 4000);
  }catch(e){
    editStatus.textContent = "حصل خطأ أثناء الحفظ" + (e && e.code ? " (" + e.code + ")" : "") + ".";
  }
}

function autoSave(){
  if(!editMode) return;
  saveToCloud();
}
